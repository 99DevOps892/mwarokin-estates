# ============================================================
# Mwarokin Estates — Netlify configuration
# Static app lives in /app. The /mwarokin-estates/* rewrite keeps
# the GitHub Pages basePath (app/js/config.js) working on Netlify.
# ============================================================

[build]
  publish = "app"
  functions = "netlify/functions"
  command = "echo 'Static site — no build step required'"

[build.environment]
  NODE_VERSION = "20"

# Cloudflare Turnstile — set real values in Netlify UI (Site settings -> Build & deploy -> Environment)
#   TURNSTILE_SITE_KEY   (public, used by app/js/bot-protection.js)
#   TURNSTILE_SECRET_KEY (secret, used only by netlify/functions/bot-gate.mjs)
# [build.environment]
#   TURNSTILE_SITE_KEY = "0x4AAAAAA..."
#   TURNSTILE_SECRET_KEY = "0x4AAAAAA..."

# GitHub-Pages-style base path compatibility
[[redirects]]
  from = "/mwarokin-estates/*"
  to = "/:splat"
  status = 200

# Pretty URL for the tenant portal
[[redirects]]
  from = "/tenant"
  to = "/dashboard.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-ancestors 'none'"
