<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Mwarokin Estates</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand"><span class="brand-mark">M</span><span class="brand-text">Mwarokin <em>Estates</em></span></a>
      <h1 class="auth-title" data-i18n="common.register">Create your account</h1>
      <p class="auth-sub">Join the Mwarokin Estates community.</p>

      <form id="register-form" class="form" novalidate>
        <div class="field">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" placeholder="Jane Mwangi" required autocomplete="name">
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="+2547XXXXXXXX" autocomplete="tel">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" required autocomplete="new-password">
          <small class="field-hint">Use 8+ characters with a mix of letters and numbers.</small>
        </div>
        <div class="field">
          <label for="role">I am a...</label>
          <select id="role">
            <option value="tenant">Tenant</option>
            <option value="landlord">Landlord</option>
            <option value="agent">Agent</option>
            <option value="caretaker">Caretaker</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">Create Account</button>
        <p class="form-error hidden" id="form-error"></p>
      </form>

      <div class="auth-alt">
        <a href="login.html">Already have an account? <strong>Sign in</strong></a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
