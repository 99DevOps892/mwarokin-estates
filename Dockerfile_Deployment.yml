```bash
#!/bin/bash

# Multi-architecture build script
docker buildx create --use
docker buildx build \
    --platform linux/amd64,linux/arm64 \
    --tag your-app:latest \
    --tag your-app:$(git rev-parse --short HEAD) \
    --push .
```

