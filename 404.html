  <script>
    // GitHub Pages SPA fallback: preserve the requested path
    (function () {
      var base = '/mwarokin-estates/';
      var path = window.location.pathname;
      var target = path.replace(/\/mwarokin-estates\/?/, '/mwarokin-estates/');
      if (target !== path) {
        window.location.replace(target);
      } else {
        window.location.replace('/mwarokin-estates/');
      }
    })();
  </script>
