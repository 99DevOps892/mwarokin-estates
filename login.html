<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Mwarokin Estates</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="brand auth-brand"><span class="brand-mark">M</span><span class="brand-text">Mwarokin <em>Estates</em></span></a>
      <h1 class="auth-title" data-i18n="common.login">Welcome back</h1>
      <p class="auth-sub">Sign in to your tenant, landlord or agent portal.</p>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Sign In</button>
        <p class="form-error hidden" id="form-error"></p>
      </form>

      <div class="auth-alt">
        <a href="register.html">Don't have an account? <strong>Register</strong></a>
      </div>
      <div class="auth-alt">
        <a href="#" id="reset-link">Forgot password?</a>
      </div>
    </div>
  </div>

  <footer class="auth-footer">
    <span class="sta-mark">STA</span>
    <span>Powered by <strong>Syllogism Technology Africa</strong> · © <span id="year"></span></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
