name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase config from secrets (if present)
        run: |
          python - <<'EOF'
          import os, re
          paths = ["js/config.js", "app/js/config.js"]
          done = False
          for path in paths:
              if not os.path.exists(path):
                  print(path + " not present — skipping")
                  continue
              src = open(path, encoding="utf-8").read()
              src = re.sub(
                r"const SUPABASE_URL = '[^']*'",
                "const SUPABASE_URL = '" + os.environ["SUPABASE_URL"] + "'",
                src,
              )
              src = re.sub(
                r"const SUPABASE_ANON_KEY = '[^']*'",
                "const SUPABASE_ANON_KEY = '" + os.environ["SUPABASE_ANON_KEY"] + "'",
                src,
              )
              open(path, "w", encoding="utf-8").write(src)
              print(path + " updated")
              done = True
          if not done:
              print("no config.js found — skipping injection")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4