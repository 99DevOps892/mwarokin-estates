name: Deploy Mwarokin Estates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ── Job 1: Deploy Supabase Edge Functions ──
  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy payments --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy mpesa-stk-push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy mpesa-callback --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy airtel-money --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy flutterwave --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy payment-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy currency --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy translations --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Edge Functions
        run: |
          for fn in payments mpesa-stk-push mpesa-callback airtel-money flutterwave payment-webhook; do
            echo "Checking $fn..."
            curl -sf -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/functions/v1/$fn" || echo "$fn not responding"
          done

  # ── Job 2: Deploy Frontend to GitHub Pages ──
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-edge-functions
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase config from secrets
        run: |
          python3 - <<'EOF'
          import os, re
          paths = ["app/js/config.js", "js/config.js"]
          for path in paths:
              if not os.path.exists(path):
                  print(path + " not present — skipping")
                  continue
              src = open(path, encoding="utf-8").read()
              src = re.sub(
                r"const SUPABASE_URL = '[^']*'",
                "const SUPABASE_URL = '" + os.environ["SUPABASE_URL"] + "'",
                src,
              )
              src = re.sub(
                r"const SUPABASE_ANON_KEY = '[^']*'",
                "const SUPABASE_ANON_KEY = '" + os.environ["SUPABASE_ANON_KEY"] + "'",
                src,
              )
              open(path, "w", encoding="utf-8").write(src)
              print(path + " updated")
          EOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf -o /dev/null -w "%{http_code}" \
            "https://99devops892.github.io/mwarokin-estates/" || echo "Pages not yet live"

  # ── Job 3: Post-deploy verification ──
  verify:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: |
          echo "=== Supabase Edge Functions ==="
          for fn in payments mpesa-stk-push airtel-money flutterwave payment-webhook; do
            status=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/functions/v1/$fn" 2>/dev/null || echo "000")
            echo "  $fn: HTTP $status"
          done
          echo ""
          echo "=== Frontend ==="
          status=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://99devops892.github.io/mwarokin-estates/" 2>/dev/null || echo "000")
          echo "  GitHub Pages: HTTP $status"
          echo ""
          echo "Deployment complete. Verify on:"
          echo "  - https://99devops892.github.io/mwarokin-estates/"
          echo "  - Supabase Dashboard > Edge Functions"
