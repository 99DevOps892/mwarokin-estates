<style>

    --obsidian:#070a08;
    --obsidian-2:#0d1310;
    --panel:#111812;
    --panel-2:#151f18;
    --hairline:#22301f;
    --forest-deep:#0f2a1c;
    --forest:#1b4d33;
    --forest-light:#2d6b47;
    --gold:#d4af37;
    --gold-bright:#f3d989;
    --gold-dim:#8a7220;
    --cream:#f2eee2;
    --cream-dim:#c9c4b3;
    --moss:#7c9484;
    --danger:#c1584f;
    --danger-bg:#2a1614;
    --success:#5aa27a;
    --success-bg:#122019;
    --pending-bg:#2a2314;
    --pending:#d9a64a;
    --radius:16px;
    --radius-sm:10px;

  *{box-sizing:border-box;}
  body{

    background:

  .checkbox{
    width:16px; height:16px; border-radius:4px; border:1px solid var(--hairline);

  .skeleton{
    background:linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%);
    background-size:400% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
    border-radius:10px;
  }

  .modal-backdrop{
    position:fixed; inset:0; z-index:200; background:rgba(4,6,4,.72); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeIn .25s ease;
  }
  .modal-card{ animation:scaleIn .35s cubic-bezier(.22,1,.36,1); max-height:90vh; overflow-y:auto; }

  .bulk-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.03));
    border:1px solid var(--gold-dim); border-radius:10px; padding:10px 16px; margin-bottom:14px;
    animation:fadeUp .3s ease;
  }

  @media print{
    body *{ visibility:hidden; }
    #printable, #printable *{ visibility:visible; }
    #printable{ position:absolute; top:0; left:0; width:100%; background:#fff; color:#111; padding:40px; }
  }

  @media (max-width:768px){
    .panel{ border-radius:14px; }
  }
</style>

/* ============================= TOAST ============================= */

const ToastCtx = React.createContext();
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const show = (message, type='success', duration=3800) => {
    const id = uid();
    setToasts(p => [...p, { id, message, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), duration);
  };
  return (
    <ToastCtx.Provider value={show}>
      {children}
      <div className="fixed bottom-0 right-0 z-[9999] p-4 flex flex-col gap-3 items-end pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className={`toast pointer-events-auto ${t.type}`}>

          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
};
const useToast = () => React.useContext(ToastCtx);

/* ============================= BROADCAST / SYNC ============================= */

const channel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('mwarokin-ledger') : null;

/* ============================= SPARKLINE ============================= */

const Sparkline = ({ points, color }) => {
  if (!points || points.length < 2) return <svg width="72" height="26" />;
  const max = Math.max(...points), min = Math.min(...points);
  const range = (max - min) || 1;
  const step = 72 / (points.length - 1);
  const coords = points.map((p,i) => `${(i*step).toFixed(1)},${(26 - ((p-min)/range)*22 - 2).toFixed(1)}`).join(' ');
  const last = points[points.length-1];
  const lastX = (72).toFixed(1), lastY = (26 - ((last-min)/range)*22 - 2).toFixed(1);
  return (
    <svg width="72" height="26" viewBox="0 0 72 26">
      <polyline points={coords} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.85" />
      <circle cx={lastX} cy={lastY} r="2.2" fill={color} />
    </svg>
  );
};

/* ============================= COLLECTIONS TREND (Chart.js) — signature element ============================= */

const CollectionsTrend = ({ history, outstanding, collected }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    const ctx = canvasRef.current.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 220);
    gradient.addColorStop(0, 'rgba(212,175,55,0.32)');
    gradient.addColorStop(1, 'rgba(212,175,55,0.0)');

    if (chartRef.current) {
      chartRef.current.data.labels = history.map(h => h.label);
      chartRef.current.data.datasets[0].data = history.map(h => h.collected);
      chartRef.current.update('none');
      return;
    }

    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: history.map(h => h.label),
        datasets: [{
          data: history.map(h => h.collected),
          borderColor: '#f3d989',
          backgroundColor: gradient,
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: '#f3d989',
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display:false }, tooltip: {
          backgroundColor:'#111812', borderColor:'#22301f', borderWidth:1,
          titleColor:'#c9c4b3', bodyColor:'#f3d989', titleFont:{ family:'JetBrains Mono', size:10 },
          bodyFont:{ family:'JetBrains Mono', size:12 }, padding:10, displayColors:false,
          callbacks: { label: (c) => `KSh ${fmt(c.parsed.y)}` }
        }},
        scales: {
          x: { grid: { display:false }, ticks: { color:'#7c9484', font:{ family:'JetBrains Mono', size:9 }, maxRotation:0 } },
          y: { display:false }
        },
        interaction: { intersect:false, mode:'index' }
      }
    });
  }, [history]);

  useEffect(() => () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } }, []);

  const pct = collected + outstanding > 0 ? Math.round((collected / (collected + outstanding)) * 100) : 0;

  return (
    <div className="panel p-5 md:p-6 animate-fade-up stagger-1">
      <div className="flex items-center justify-between mb-1">
        <div>
          <h3 className="font-display font-semibold text-xl" style={{color:'var(--cream)'}}>Collections Trend</h3>
          <p className="text-xs font-mono mt-0.5" style={{color:'var(--moss)'}}>Last {history.length} days · live-updating</p>
        </div>
        <div className="text-right">
          <div className="font-mono text-2xl font-semibold" style={{color:'var(--gold-bright)'}}>{pct}%</div>
          <div className="font-label text-[9px] tracking-widest" style={{color:'var(--moss)'}}>COLLECTION HEALTH</div>
        </div>
      </div>
      <div style={{ height:220 }} className="mt-4">
        <canvas ref={canvasRef} />
      </div>
    </div>
  );
};

const BillForm = ({ onSave }) => {
  const empty = { location:'', buildingId:'', tenantId:'', monthlyRent:'', electricity:'', water:'', internet:'', digitalTv:'', security:'', parking:'', trash:'' };
  const [form, setForm] = useState(empty);
  const [errors, setErrors] = useState({});
  const [locationResult, setLocationResult] = useState('');
  const [currencyInfo, setCurrencyInfo] = useState(null);
  const toast = useToast();

  const total = useMemo(() => billCategories.reduce((s,c) => s + (parseFloat(form[c.id]) || 0), 0), [form]);

  const handleChange = (e) => {
    const { id, value } = e.target;
    setForm(p => ({ ...p, [id]: value }));
    setErrors(p => ({ ...p, [id]: '' }));
  };

  const validate = () => {
    const errs = {};
    if (!form.location) errs.location = 'Required';
    if (!form.buildingId) errs.buildingId = 'Required';
    if (!form.tenantId) errs.tenantId = 'Required';
    billCategories.forEach(c => {
      if (form[c.id] && (isNaN(form[c.id]) || parseFloat(form[c.id]) < 0)) errs[c.id] = 'Invalid';
    });
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!validate()) { toast('Please fix the highlighted fields', 'error'); return; }
    const breakdown = {};
    billCategories.forEach(c => { breakdown[c.id] = parseFloat(form[c.id]) || 0; });
    onSave({ ...form, total, breakdown });

  const getLocation = () => {
    if (!navigator.geolocation) { setLocationResult('Not supported on this device'); return; }

    if (typeof window.jspdf === 'undefined') { toast('PDF engine unavailable', 'error'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Mwarokin Estates — Statement', 20, 22);
    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.text(`Reference: ${bill.id}`, 20, 32);

    doc.text(`Unit: ${bill.property}`, 20, 46);
    doc.text(`Due: ${bill.due}`, 20, 53);
    doc.text(`Status: ${bill.status.toUpperCase()}`, 20, 60);

    doc.setFont('helvetica', 'bold');
    doc.text('Total', 20, y); doc.text(`KSh ${fmt(bill.amount)}`, 150, y);

    doc.save(`${bill.id}-statement.pdf`);

/* ============================= BILLS TABLE (sortable + selectable) ============================= */

const BillsTable = ({ bills, onMarkPaid, search, setSearch, onViewStatement, newIds }) => {
  const [filter, setFilter] = useState('all');
  const [propertyFilter, setPropertyFilter] = useState('all');
  const [sort, setSort] = useState({ key:'due', dir:'asc' });
  const [selected, setSelected] = useState(new Set());
  const toast = useToast();

  const properties = useMemo(() => ['all', ...new Set(bills.map(b => b.property))], [bills]);

  const filtered = useMemo(() => {
    let list = filter === 'all' ? bills : bills.filter(b => b.status === filter);
    if (propertyFilter !== 'all') list = list.filter(b => b.property === propertyFilter);
    if (search) {
      const q = search.toLowerCase();
      list = list.filter(b => b.tenant.toLowerCase().includes(q) || b.property.toLowerCase().includes(q) || b.id.toLowerCase().includes(q));
    }
    const sorted = [...list].sort((a,b) => {
      let av = a[sort.key], bv = b[sort.key];
      if (sort.key === 'due') { av = new Date(av).getTime(); bv = new Date(bv).getTime(); }
      if (typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if (av < bv) return sort.dir === 'asc' ? -1 : 1;
      if (av > bv) return sort.dir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }, [bills, filter, propertyFilter, search, sort]);

  const statusMap = {
    paid: { label:'Paid', cls:'badge-paid' },
    pending: { label:'Pending', cls:'badge-pending' },
    overdue: { label:'Overdue', cls:'badge-overdue' },
  };

  const toggleSort = (key) => {
    setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir:'asc' });
  };
  const sortIcon = (key) => sort.key !== key ? '' : (sort.dir === 'asc' ? ' \u25b2' : ' \u25bc');

  const toggleSelect = (id) => setSelected(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const toggleSelectAll = () => setSelected(prev => prev.size === filtered.length ? new Set() : new Set(filtered.map(b => b.id)));

  const bulkMarkPaid = () => {
    const ids = [...selected].filter(id => bills.find(b => b.id === id)?.status !== 'paid');
    if (ids.length === 0) { toast('Selected entries are already paid', 'error'); return; }
    onMarkPaid(ids);
    setSelected(new Set());

    const header = 'ID,Tenant,Unit,Amount,Due,Status,Method\\n';
    const body = rows.map(b => `${b.id},"${b.tenant}","${b.property}",${b.amount},${b.due},${b.status},${b.method}`).join('\\n');
    downloadBlob(header + body, `mwarokin-ledger-${label}-${Date.now()}.csv`, 'text/csv');
    toast('CSV exported');
  };

  return (
    <div className="panel p-5 md:p-6 animate-fade-up stagger-4">
      <div className="flex flex-wrap items-center justify-between gap-4 mb-5">
        <h3 className="font-display font-semibold text-xl" style={{color:'var(--cream)'}}>Ledger Entries</h3>
        <div className="flex gap-2 flex-wrap items-center">
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tenant, unit, ID…" className="input text-sm w-44" />
          <select className="input text-xs w-36" value={propertyFilter} onChange={e => setPropertyFilter(e.target.value)}>
            {properties.map(p => <option key={p} value={p}>{p === 'all' ? 'All units' : p}</option>)}
          </select>
          {['all','paid','pending','overdue'].map(f => (
            <button key={f} onClick={() => setFilter(f)}
              className="px-3.5 py-1.5 text-xs font-label rounded-full transition-all capitalize"
              style={filter === f
                ? { background:'linear-gradient(135deg, var(--gold-bright), var(--gold))', color:'#191305' }
                : { background:'var(--panel-2)', color:'var(--moss)', border:'1px solid var(--hairline)' }}>
              {f}
            </button>
          ))}
          <button onClick={() => exportCsv(filtered, 'filtered')} className="icon-btn-sm" title="Export CSV">
            <i className="fas fa-file-csv" />
          </button>
        </div>
      </div>

      {selected.size > 0 && (
        <div className="bulk-bar">
          <span className="text-sm font-medium" style={{color:'var(--gold-bright)'}}>
            <i className="fas fa-check-circle mr-2" />{selected.size} selected
          </span>
          <div className="flex gap-2">
            <button onClick={() => exportCsv(bills.filter(b => selected.has(b.id)), 'selected')} className="btn-ghost">
              <i className="fas fa-download" /> Export
            </button>
            <button onClick={bulkMarkPaid} className="btn-gold" style={{padding:'8px 16px', fontSize:'0.75rem'}}>
              <i className="fas fa-check" /> Mark paid
            </button>
          </div>
        </div>
      )}

      <div className="overflow-x-auto -mx-1">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left" style={{color:'var(--moss)', borderBottom:'1px solid var(--hairline)'}}>
              <th className="pb-3 pr-2 w-8">
                <input type="checkbox" className="checkbox" checked={filtered.length > 0 && selected.size === filtered.length} onChange={toggleSelectAll} />
              </th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold sortable-th" onClick={() => toggleSort('id')}>ID{sortIcon('id')}</th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold sortable-th" onClick={() => toggleSort('tenant')}>TENANT{sortIcon('tenant')}</th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold">UNIT</th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold sortable-th" onClick={() => toggleSort('amount')}>AMOUNT{sortIcon('amount')}</th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold sortable-th" onClick={() => toggleSort('due')}>DUE{sortIcon('due')}</th>
              <th className="pb-3 pr-4 font-label text-[10px] tracking-widest font-semibold sortable-th" onClick={() => toggleSort('status')}>STATUS{sortIcon('status')}</th>
              <th className="pb-3 font-label text-[10px] tracking-widest font-semibold text-right">ACTION</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr><td colSpan="8" className="py-10 text-center" style={{color:'var(--moss)'}}>
                <i className="fas fa-inbox text-2xl block mb-2" /> No entries match
              </td></tr>
            ) : filtered.map(bill => {
              const s = statusMap[bill.status] || statusMap.pending;
              return (
                <tr key={bill.id} className={`table-row ${newIds.has(bill.id) ? 'row-new' : ''}`} style={{borderBottom:'1px solid var(--hairline)'}}>
                  <td className="py-3.5 pr-2">
                    <input type="checkbox" className="checkbox" checked={selected.has(bill.id)} onChange={() => toggleSelect(bill.id)} />
                  </td>
                  <td className="py-3.5 pr-4 font-mono text-xs cursor-pointer" style={{color:'var(--moss)'}} onClick={() => onViewStatement(bill)}>{bill.id}</td>
                  <td className="py-3.5 pr-4 font-medium cursor-pointer" style={{color:'var(--cream)'}} onClick={() => onViewStatement(bill)}>{bill.tenant}</td>
                  <td className="py-3.5 pr-4" style={{color:'var(--cream-dim)'}}>{bill.property}</td>
                  <td className="py-3.5 pr-4 font-mono" style={{color:'var(--gold-bright)'}}>KSh {fmt(bill.amount)}</td>
                  <td className="py-3.5 pr-4 font-mono text-xs" style={{color:'var(--cream-dim)'}}>{bill.due}</td>
                  <td className="py-3.5 pr-4">
                    <span className={`badge ${s.cls}`}><span className="dot" />{s.label}</span>
                  </td>
                  <td className="py-3.5 text-right">
                    <div className="flex items-center justify-end gap-2">
                      <button onClick={() => onViewStatement(bill)} className="icon-btn-sm" title="View statement"><i className="fas fa-receipt" /></button>
                      {bill.status !== 'paid' ? (
                        <button onClick={() => onMarkPaid([bill.id])} className="btn-ghost" style={{color:'var(--gold)'}}>Mark paid</button>
                      ) : (
                        <span className="font-mono text-xs" style={{color:'var(--moss)'}}>{bill.method}</span>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
};

/* ============================= PAYMENT / M-PESA STK ============================= */

const PaymentPanel = ({ total }) => {
  const [phone, setPhone] = useState('');
  const [method, setMethod] = useState('mpesa');
  const [stage, setStage] = useState('idle');
  const [progress, setProgress] = useState(0);
  const toast = useToast();

  const validPhone = /^0[71]\d{8}$/.test(phone);

  const handlePay = () => {
    if (total <= 0) { toast('Add bill amounts before paying', 'error'); return; }
    if (method === 'mpesa' && !validPhone) { toast('Enter a valid Safaricom number (07xx / 01xx)', 'error'); return; }
    setStage('requesting');
    setProgress(15);
    setTimeout(() => {
      setStage('waiting');
      setProgress(55);
      toast(method === 'mpesa' ? 'STK push sent — enter M-Pesa PIN on your phone' : 'Payment request sent', 'success');
    }, 900);
    setTimeout(() => {
      setProgress(100);
      setStage('done');
      toast(`Payment of KSh ${fmt(total)} confirmed`, 'success');
    }, 2600);
    setTimeout(() => { setStage('idle'); setProgress(0); }, 5200);
  };

  return (
    <div className="panel p-5 md:p-6 animate-fade-up stagger-5">
      <h3 className="font-display font-semibold text-xl flex items-center gap-2 mb-4" style={{color:'var(--cream)'}}>
        <i className="fas fa-wallet" style={{color:'var(--gold)'}} /> Settle Balance
      </h3>

      <div className="flex gap-2 mb-4">
        {[{id:'mpesa', label:'M-Pesa', icon:'fa-mobile-screen'}, {id:'syllopay', label:'SylloPay', icon:'fa-bolt'}, {id:'bank', label:'Bank', icon:'fa-university'}].map(m => (
          <button key={m.id} onClick={() => setMethod(m.id)}
            className="flex-1 py-2.5 rounded-lg font-label text-xs flex flex-col items-center gap-1.5 transition-all"
            style={method === m.id ? { background:'rgba(212,175,55,0.10)', border:'1px solid var(--gold-dim)', color:'var(--gold-bright)' } : { background:'var(--panel-2)', border:'1px solid var(--hairline)', color:'var(--moss)' }}>
            <i className={`fas ${m.icon}`} /> {m.label}
          </button>
        ))}
      </div>

      <div className="rounded-xl p-5 mb-4" style={{background:'linear-gradient(145deg, var(--forest-deep), var(--obsidian-2))', border:'1px solid var(--hairline)'}}>
        <p className="font-label text-[10px] tracking-widest" style={{color:'var(--moss)'}}>AMOUNT DUE</p>
        <p className="font-mono text-3xl font-semibold mt-1" style={{color:'var(--gold-bright)'}}>KSh {fmt(total)}</p>
      </div>

      {method === 'mpesa' && (
        <div className="mb-4">
          <label className="font-label text-[10px] tracking-widest block mb-1.5" style={{color:'var(--moss)'}}>SAFARICOM NUMBER</label>
          <input value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g,'').slice(0,10))} placeholder="0712 345 678" className="input input-mono" />
        </div>
      )}

      {progress > 0 && (
        <div className="mb-4">
          <div className="flex justify-between text-xs font-mono mb-1.5" style={{color:'var(--cream-dim)'}}>
            <span>{stage === 'requesting' ? 'Requesting…' : stage === 'waiting' ? 'Awaiting confirmation…' : 'Confirmed'}</span>
            <span>{progress}%</span>
          </div>
          <div className="progress-track"><div className="progress-fill" style={{width:`${progress}%`}} /></div>
        </div>
      )}

      <button onClick={handlePay} disabled={stage !== 'idle'} className="w-full btn-gold justify-center !py-3.5 text-sm">
        {stage === 'idle' && <><i className="fas fa-lock" /> Pay KSh {fmt(total)}</>}
        {stage === 'requesting' && <><i className="fas fa-spinner fa-spin" /> Sending request</>}
        {stage === 'waiting' && <><i className="fas fa-spinner fa-spin" /> Confirming</>}
        {stage === 'done' && <><i className="fas fa-check" /> Payment confirmed</>}
      </button>
      <p className="text-center text-xs mt-3 flex items-center justify-center gap-1.5" style={{color:'var(--moss)'}}>
        <i className="fas fa-shield-halved" style={{color:'var(--gold-dim)'}} /> Encrypted transaction · Demo simulation
      </p>
    </div>
  );
};

/* ============================= FX TICKER STRIP ============================= */

const FxStrip = ({ rates }) => (
  <div className="max-w-7xl mx-auto px-5 mb-6">
    <div className="panel-flat px-5 py-3 flex items-center gap-6 overflow-x-auto animate-fade-up">
      <span className="font-label text-[10px] tracking-widest flex items-center gap-2 flex-shrink-0" style={{color:'var(--gold)'}}>
        <span className="pulse-live" /> LIVE FX
      </span>
      {rates.map(r => (
        <span key={r.country} className="font-mono text-xs flex-shrink-0" style={{color:'var(--cream-dim)'}}>
          {r.symbol}/USD <span style={{color:'var(--gold-bright)'}}>{r.rate.toFixed(2)}</span>
          <span style={{color: r.dir === 'up' ? 'var(--success)' : 'var(--danger)', marginLeft:'4px'}}>
            <i className={`fas ${r.dir === 'up' ? 'fa-caret-up' : 'fa-caret-down'}`} />
          </span>
        </span>
      ))}
    </div>
  </div>
);

/* ============================= FOOTER ============================= */

const Footer = () => (
  <footer className="mt-16 pt-12 pb-6" style={{borderTop:'1px solid var(--hairline)'}}>
    <div className="max-w-7xl mx-auto px-5 grid grid-cols-2 md:grid-cols-4 gap-8">
      <div className="col-span-2 md:col-span-1">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg, var(--forest-light), var(--forest-deep))', border:'1px solid var(--gold-dim)'}}>
            <i className="fas fa-vault text-xs" style={{color:'var(--gold)'}} />
          </div>
          <span className="font-display font-semibold text-lg" style={{color:'var(--cream)'}}>Mwarokin Estates</span>
        </div>
        <p className="text-sm max-w-xs" style={{color:'var(--moss)'}}>A living ledger for rent, utilities and levies — built for African estates.</p>
      </div>
      {[
        { h:'Ledger', items:['Bills','Payments','Statements'] },
        { h:'Estate', items:['Tenants','Properties','Maintenance'] },
        { h:'Company', items:['About','Support','Contact'] },
      ].map(col => (
        <div key={col.h}>
          <h4 className="font-label text-xs mb-3" style={{color:'var(--gold-dim)'}}>{col.h.toUpperCase()}</h4>
          <ul className="space-y-2 text-sm" style={{color:'var(--moss)'}}>
            {col.items.map(i => <li key={i}><a href="#" style={{color:'var(--moss)'}}>{i}</a></li>)}
          </ul>
        </div>
      ))}
    </div>
    <div className="max-w-7xl mx-auto px-5 mt-8 pt-5 text-center text-xs" style={{borderTop:'1px solid var(--hairline)', color:'var(--moss)'}}>
      © 2026 Mwarokin Estates — The Ledger. Syllogism Technology Africa.
    </div>
  </footer>
);

/* ============================= MAIN APP ============================= */

const App = () => {
  const [ready, setReady] = useState(false);
  const [bills, setBills] = useState(() => {
    try {
      const saved = localStorage.getItem('mwarokin-ledger-bills');
      return saved ? JSON.parse(saved) : seedBills;
    } catch (_) { return seedBills; }
  });
  const [feed, setFeed] = useState([]);
  const [search, setSearch] = useState('');
  const [rates, setRates] = useState(() => Object.entries(currencyRates).slice(0,6).map(([country, r]) => ({ country, ...r, dir:'up' })));
  const [statementBill, setStatementBill] = useState(null);
  const [newIds, setNewIds] = useState(new Set());
  const [history, setHistory] = useState(() => {
    const days = [];
    const base = 60000;
    for (let i = 13; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000);
      days.push({ label: d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }), collected: Math.round(base + Math.random()*40000 + (13-i)*1800) });
    }
    return days;
  });
  const [collectedSpark, setCollectedSpark] = useState([]);
  const [pendingSpark, setPendingSpark] = useState([]);

  const toast = useToast();
  const feedTimer = useRef(null);
  const fxTimer = useRef(null);

  useEffect(() => { const t = setTimeout(() => setReady(true), 650); return () => clearTimeout(t); }, []);

  useEffect(() => {
    localStorage.setItem('mwarokin-ledger-bills', JSON.stringify(bills));
    if (channel) channel.postMessage({ type:'bills-update', bills });
  }, [bills]);

  useEffect(() => {
    if (!channel) return;
    const handler = (e) => { if (e.data?.type === 'bills-update') setBills(e.data.bills); };
    channel.addEventListener('message', handler);
    return () => channel.removeEventListener('message', handler);
  }, []);

  const flashNew = (id) => {
    setNewIds(prev => new Set(prev).add(id));
    setTimeout(() => setNewIds(prev => { const n = new Set(prev); n.delete(id); return n; }), 2300);
  };

  const pushFeedEvent = useCallback((custom) => {
    const verb = custom?.verb || feedVerbs[Math.floor(Math.random()*feedVerbs.length)];
    const tenant = custom?.tenant || feedTenants[Math.floor(Math.random()*feedTenants.length)];
    const property = custom?.property || feedProps[Math.floor(Math.random()*feedProps.length)];
    const amount = custom?.amount != null ? custom.amount : (verb.v.includes('Payment') ? Math.floor(15000 + Math.random()*30000) : null);
    const item = {
      id: uid(), verb: verb.v, icon: verb.icon, tone: verb.tone, tenant, property, amount,
      time: new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' }),
    };
    setFeed(p => [item, ...p].slice(0, 30));
    if (amount) {
      setHistory(h => {
        const next = [...h];
        next[next.length - 1] = { ...next[next.length - 1], collected: next[next.length - 1].collected + amount };
        return next;
      });
    }
  }, []);

  useEffect(() => {
    pushFeedEvent({ verb: feedVerbs[0], tenant:'Faith Akinyi', property:'Parklands 2E', amount: 27500 });
    feedTimer.current = setInterval(() => pushFeedEvent(), 6500);
    return () => clearInterval(feedTimer.current);
  }, [pushFeedEvent]);

  useEffect(() => {
    fxTimer.current = setInterval(() => {
      setRates(prev => prev.map(r => {
        const delta = (Math.random() - 0.5) * (r.rate * 0.002);
        return { ...r, rate: Math.max(0.01, r.rate + delta), dir: delta >= 0 ? 'up' : 'down' };
      }));
    }, 3200);
    return () => clearInterval(fxTimer.current);
  }, []);

  useEffect(() => {
    const t = setInterval(() => {
      setCollectedSpark(prev => [...prev, bills.filter(b => b.status==='paid').reduce((s,b)=>s+b.amount,0)].slice(-8));
      setPendingSpark(prev => [...prev, bills.filter(b => b.status==='pending').reduce((s,b)=>s+b.amount,0)].slice(-8));
    }, 4000);
    return () => clearInterval(t);
  }, [bills]);

  const handleSave = (data) => {
    const newBill = {
      id: `BL-${2400 + bills.length + Math.floor(Math.random()*90)}`,
      tenant: data.tenantId || 'New Tenant',
      property: data.buildingId || 'New Unit',
      amount: data.total || 0,
      due: new Date(Date.now() + 7*86400000).toISOString().slice(0,10),
      status: 'pending',
      method: '\u2014',
      breakdown: data.breakdown || synthBreakdown(data.total || 0),
    };
    setBills(prev => [newBill, ...prev]);
    flashNew(newBill.id);
    pushFeedEvent({ verb: feedVerbs[1], tenant: newBill.tenant, property: newBill.property, amount: newBill.amount });
  };

  const handleMarkPaid = (ids) => {
    setBills(prev => prev.map(b => ids.includes(b.id) ? { ...b, status:'paid', method:'M-Pesa' } : b));
    ids.forEach(id => {
      flashNew(id);
      const b = bills.find(x => x.id === id);
      if (b) pushFeedEvent({ verb: feedVerbs[0], tenant: b.tenant, property: b.property, amount: b.amount });
    });
    toast(ids.length > 1 ? `${ids.length} entries marked as paid` : 'Marked as paid', 'success');
  };

  const totalCollected = useMemo(() => bills.filter(b => b.status === 'paid').reduce((s,b) => s + b.amount, 0), [bills]);
  const totalPending = useMemo(() => bills.filter(b => b.status === 'pending').reduce((s,b) => s + b.amount, 0), [bills]);
  const totalOverdue = useMemo(() => bills.filter(b => b.status === 'overdue').reduce((s,b) => s + b.amount, 0), [bills]);
  const totalOutstanding = totalPending + totalOverdue;

  const tickerEvents = useMemo(() => feed.slice(0,8).map(e => ({
    icon:e.icon, tone:e.tone,
    text:`${e.tenant} · ${e.verb.toLowerCase()}${e.amount != null ? ' · KSh ' + fmt(e.amount) : ''}`
  })), [feed]);

  const liveFxLabel = rates[0] ? `KSh ${rates[0].rate.toFixed(2)} / USD` : '';

  return (
    <div className="min-h-screen">
      <Navbar liveFxLabel={liveFxLabel} />
      <Hero totalCollected={totalCollected} tickerEvents={tickerEvents.length ? tickerEvents : [{icon:'fa-circle-check', tone:'moss', text:'Awaiting live activity…'}]} />
      <FxStrip rates={rates} />

      <main className="max-w-7xl mx-auto px-5 pb-8">
        {!ready ? (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            {[1,2,3,4].map(i => <SkeletonBlock key={i} h="108px" />)}
          </div>
        ) : (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <StatCard icon="fa-sack-dollar" label="COLLECTED" value={`KSh ${fmt(totalCollected)}`} sub={`${bills.filter(b=>b.status==='paid').length} bills settled`} color="#5aa27a" delay="1" spark={collectedSpark} />
            <StatCard icon="fa-hourglass-half" label="PENDING" value={`KSh ${fmt(totalPending)}`} sub={`${bills.filter(b=>b.status==='pending').length} awaiting payment`} color="#d9a64a" delay="2" spark={pendingSpark} />
            <StatCard icon="fa-triangle-exclamation" label="OVERDUE" value={`KSh ${fmt(totalOverdue)}`} sub={`${bills.filter(b=>b.status==='overdue').length} need attention`} color="#c1584f" delay="3" />
            <StatCard icon="fa-scale-balanced" label="OUTSTANDING" value={`KSh ${fmt(totalOutstanding)}`} sub="Rent, utilities & levies" color="#d4af37" delay="4" />
          </div>
        )}

        {!ready ? (
          <SkeletonBlock h="280px" className="mb-8" />
        ) : (
          <div className="mb-8">
            <CollectionsTrend history={history} outstanding={totalOutstanding} collected={totalCollected} />
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-2 space-y-6">
            {!ready ? <SkeletonBlock h="360px" /> : <BillForm onSave={handleSave} />}
            {!ready ? <SkeletonBlock h="420px" /> : (
              <BillsTable bills={bills} onMarkPaid={handleMarkPaid} search={search} setSearch={setSearch} onViewStatement={setStatementBill} newIds={newIds} />
            )}
          </div>
          <div className="space-y-6">
            {!ready ? <SkeletonBlock h="320px" /> : <PaymentPanel total={totalOutstanding} />}
            {!ready ? <SkeletonBlock h="300px" /> : <ActivityFeed events={feed} />}
          </div>
        </div>
      </main>

      <Footer />

      {statementBill && <StatementModal bill={statementBill} onClose={() => setStatementBill(null)} />}

      <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})}
        className="fixed bottom-6 right-6 w-11 h-11 rounded-full flex items-center justify-center z-30"
        style={{background:'linear-gradient(135deg, var(--gold-bright), var(--gold))', color:'#191305', boxShadow:'0 8px 24px rgba(212,175,55,0.3)'}}>
        <i className="fas fa-arrow-up" />
      </button>
    </div>
  );
};

const Root = () => (
  <ToastProvider><App /></ToastProvider>
);

ReactDOM.render(<Root />, document.getElementById('root'));
</script>
</body>
</html>
