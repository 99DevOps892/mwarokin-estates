<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --color-obsidian: #0F1419;
            --color-forest: #1F4D3D;
            --color-forest-light: #2A6B5C;
            --color-forest-dark: #0F2B24;
            --color-gold: #D4AF37;
            --color-gold-dark: #C49A2E;
            --color-text: #1A1A1A;
            --color-text-light: #6B7280;
            --color-border: #E5E7EB;
            --color-bg-light: #F9FAFB;
        }
        
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: var(--color-text);
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        
        .font-sans-display {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
        }
        
        .text-overflow-ellipsis {
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        
        /* Smooth transitions */
        .smooth-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .smooth-transition-fast {
            transition: all 0.15s ease-out;
        }
        
        /* Color utilities */
        .text-forest { color: var(--color-forest); }
        .text-gold { color: var(--color-gold); }
        .bg-forest { background-color: var(--color-forest); }
        .bg-gold { background-color: var(--color-gold); }
        .border-forest { border-color: var(--color-forest); }
        
        /* Premium Cards */
        .card-premium {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        
        .card-premium:hover {
            box-shadow: 0 12px 24px rgba(31, 77, 61, 0.12);
            border-color: var(--color-forest);
        }
        
        /* Image Gallery */
        .gallery-main {
            border-radius: 0.875rem;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, var(--color-forest-dark) 0%, var(--color-forest) 100%);
            position: relative;
        }
        
        .gallery-thumbnail {
            border-radius: 0.5rem;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
            aspect-ratio: 1;
        }
        
        .gallery-thumbnail.active {
            border-color: var(--color-gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }
        
        /* Hero Section */

            position: relative;
            overflow: hidden;
        }
        
        .hero-premium::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 107, 92, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        
        /* Input Enhancement */
        .input-premium {
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.9375rem;
            transition: all 0.2s ease;

        }

            outline: none;
            border-color: var(--color-forest);
            box-shadow: 0 0 0 3px rgba(31, 77, 61, 0.1);
            background: white;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--color-forest) 0%, var(--color-forest-light) 100%);
            color: white;
            padding: 0.875rem 1.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9375rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            smooth-transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(31, 77, 61, 0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(31, 77, 61, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: var(--color-forest);
            padding: 0.875rem 1.75rem;
            border: 1.5px solid var(--color-forest);
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            smooth-transition: all 0.2s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(31, 77, 61, 0.04);
        }
        
        /* Badges */
        .badge-premium {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.875rem;
            border-radius: 9999px;
            font-size: 0.8125rem;
            font-weight: 600;
            background: var(--color-forest);
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .badge-gold {
            background: var(--color-gold);
            color: white;
        }
        
        /* Star Rating */
        .star {
            color: #FBBF24;
            fill: #FBBF24;
        }
        
        .star-empty {
            color: #E5E7EB;
            fill: #E5E7EB;
        }
        
        /* Modal Enhancement */
        .modal-backdrop-premium {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        
        .modal-content-premium {
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.875rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            .gallery-main {
                aspect-ratio: 4/3;
            }
        }
        
        /* Scrollbar Enhancement */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f3f4f6;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--color-forest);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-forest-light);
        }
        
        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

                                        <label className="block text-sm font-semibold text-gray-900 mb-4">🏠 Amenities</label>
                                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                            {amenitiesOptions.map(amenity => (
                                                <label key={amenity} className="flex items-center gap-2 cursor-pointer hover:bg-white p-2 rounded smooth-transition-fast">
                                                    <input
                                                        type="checkbox"
                                                        checked={selectedAmenities.includes(amenity.split(' ')[0])}
                                                        onChange={(e) => {
                                                            const key = amenity.split(' ')[0];
                                                            if (e.target.checked) {
                                                                setSelectedAmenities([...selectedAmenities, key]);
                                                            } else {
                                                                setSelectedAmenities(selectedAmenities.filter(a => a !== key));
                                                            }
                                                        }}
                                                        className="w-4 h-4 rounded border-gray-300"
                                                    />
                                                    <span className="text-sm text-gray-700">{amenity}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Results */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div className="mb-8">
                            <h2 className="text-3xl md:text-4xl font-bold text-gray-900 mb-2">
                                {filteredProperties.length} Properties Available
                            </h2>
                            <p className="text-gray-600">
                                {favoriteProperties.length > 0 && `${favoriteProperties.length} in your wishlist • `}
                                Showing {filteredProperties.length} of {properties.length} premium accommodations in Nairobi
                            </p>
                        </div>

                        {filteredProperties.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredProperties.map(prop => (
                                    <PropertyCard key={prop.id} prop={prop} />
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-24">
                                <div className="text-7xl mb-4">🔍</div>
                                <h3 className="text-3xl font-semibold text-gray-900 mb-3">No properties found</h3>
                                <p className="text-gray-600 mb-8 max-w-md mx-auto">Try adjusting your filters, expanding your budget, or searching a different neighborhood</p>
                                <button
                                    onClick={() => {
                                        setSearchQuery('');
                                        setSelectedLocation('all');
                                        setPriceRange([3000, 15000]);
                                        setSelectedAmenities([]);
                                        setSortBy('recommended');
                                        setPropertyType('all');
                                        setMinRating(0);
                                    }}
                                    className="btn-primary"
                                >
                                    Reset All Filters
                                </button>
                            </div>
                        )}
                    </section>

                    {/* Footer */}
                    <footer className="border-t border-gray-200 bg-gray-900 text-white mt-20 py-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-8 mb-12">
                                <div>
                                    <h4 className="font-bold mb-4">Explore</h4>
                                    <ul className="space-y-2 text-sm text-gray-400">
                                        <li><a href="#" className="hover:text-white transition">Neighborhoods</a></li>
                                        <li><a href="#" className="hover:text-white transition">All Properties</a></li>
                                        <li><a href="#" className="hover:text-white transition">Wishlist</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-4">Host with us</h4>
                                    <ul className="space-y-2 text-sm text-gray-400">
                                        <li><a href="#" className="hover:text-white transition">List Your Property</a></li>
                                        <li><a href="#" className="hover:text-white transition">Hosting Guide</a></li>
                                        <li><a href="#" className="hover:text-white transition">Dashboard</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-4">Support</h4>
                                    <ul className="space-y-2 text-sm text-gray-400">
                                        <li><a href="#" className="hover:text-white transition">Help Center</a></li>
                                        <li><a href="#" className="hover:text-white transition">Contact Us</a></li>
                                        <li><a href="#" className="hover:text-white transition">Safety</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-4">Company</h4>
                                    <ul className="space-y-2 text-sm text-gray-400">
                                        <li><a href="#" className="hover:text-white transition">About</a></li>
                                        <li><a href="#" className="hover:text-white transition">Press</a></li>
                                        <li><a href="#" className="hover:text-white transition">Careers</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-4">Legal</h4>
                                    <ul className="space-y-2 text-sm text-gray-400">
                                        <li><a href="#" className="hover:text-white transition">Privacy</a></li>
                                        <li><a href="#" className="hover:text-white transition">Terms of Service</a></li>
                                        <li><a href="#" className="hover:text-white transition">Cookies</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div className="border-t border-gray-800 pt-8 text-center text-sm text-gray-400">
                                <p className="mb-2">© 2024 Mwarokin Stays. Powered by Syllogism Technology Africa.</p>
                                <p>🇰🇪 Built in Nairobi • 💚 For Africa • 🌍 By Africans</p>
                            </div>
                        </div>
                    </footer>

                    {/* Modals */}
                    <PropertyDetailsModal />
                    <BookingDetailsModal />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MwarokinStaysPremium />);
    </script>
</body>
</html>
