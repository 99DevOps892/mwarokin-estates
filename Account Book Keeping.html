<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Mwarokin Estates - Account Book keeping </title>
  <!-- Google Fonts + Font Awesome + Chart.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f3f9;
      color: #1e2a3e;
      overflow-x: hidden;
    }

    /* premium glassmorphism + subtle gradients */
    .premium-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .premium-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12);
    }

    /* sidebar */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, #0f2b3d 0%, #0a1e2c 100%);
      color: #eef4ff;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 20;
      transition: all 0.3s;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.06);
    }

    .sidebar-brand {
      padding: 32px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-brand h2 {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #FFF9E6, #D4AF37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sidebar-brand p {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 6px;
    }

    .nav-menu {
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #cfdfed;
    }

    .nav-item i {
      width: 24px;
      font-size: 1.2rem;
    }

    .nav-item.active {
      background: rgba(212, 175, 55, 0.2);
      color: #FFE5A3;
      border-left: 3px solid #D4AF37;
      background: linear-gradient(90deg, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0) 100%);
    }

    .nav-item:hover:not(.active) {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    /* main content */
    .main-content {
      margin-left: 280px;
      padding: 28px 32px;
      min-height: 100vh;
    }

    /* top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(130deg, #1e3b4a, #2c5a6e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    /* metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .metric-card {
      padding: 20px 20px;
      border-radius: 28px;
    }

    .metric-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #5b6e8c;
    }

    .metric-value {
      font-size: 2.1rem;
      font-weight: 800;
      margin-top: 10px;
      color: #0a2e3f;
    }

    /* tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .data-table th {
      text-align: left;
      padding: 14px 8px;
      color: #4a5b79;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
    }

    .data-table td {
      padding: 12px 8px;
      border-bottom: 1px solid #edf2f7;
    }

    .badge {
      background: #eef2ff;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge-success {
      background: #e0f2e9;
      color: #1f7840;
    }

    .btn-sm {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin: 0 4px;
      color: #6c86a3;
      transition: 0.1s;
    }

    .btn-sm:hover {
      color: #d4af37;
    }

    .btn-primary {
      background: #0f2b3d;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .insight-card {
      background: linear-gradient(135deg, #1e2f3e, #10222e);
      color: white;
      border-radius: 28px;
      padding: 20px;
    }

    @media (max-width: 780px) {
      .sidebar {
        transform: translateX(-100%);
        position: fixed;
      }
      .main-content {
        margin-left: 0;
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
    }

    input, select, textarea {
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 10px 16px;
      font-family: inherit;
      background: white;
    }

    .modal-bg {
      background: rgba(0,0,0,0.5);
      position: fixed;
      top:0;left:0;right:0;bottom:0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: white;
      max-width: 500px;
      width: 90%;
      border-radius: 32px;
      padding: 24px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2><i class="fas fa-book-open"></i> Mwarokin</h2>
    <p>Estates · Premium Bookkeeping</p>
  </div>
  <div class="nav-menu">
    <div class="nav-item active" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
    <div class="nav-item" data-tab="transactions"><i class="fas fa-exchange-alt"></i> Transactions</div>
    <div class="nav-item" data-tab="invoices"><i class="fas fa-file-invoice-dollar"></i> Invoicing</div>
    <div class="nav-item" data-tab="banking"><i class="fas fa-university"></i> Banking & Recon</div>
    <div class="nav-item" data-tab="reports"><i class="fas fa-chart-line"></i> Reports & Tax</div>
  </div>
  <div style="padding: 24px; font-size: 12px; opacity: 0.6; position: absolute; bottom: 20px;">
    <i class="fas fa-shield-alt"></i> AI-powered insights
  </div>
</div>

<div class="main-content" id="mainContent">
  <div class="top-bar">
    <h1 class="page-title" id="currentPageTitle">Dashboard</h1>
    <div><i class="fas fa-globe-americas"></i> <span id="currencySymbol">$</span> USD</div>
  </div>

  <!-- DYNAMIC VIEWS -->
  <div id="dashboardView"></div>
  <div id="transactionsView" class="hidden"></div>
  <div id="invoicesView" class="hidden"></div>
  <div id="bankingView" class="hidden"></div>
  <div id="reportsView" class="hidden"></div>
</div>

<script>
  // ---------- DATA MODELS ----------
  let transactions = [];
  let invoices = [];
  let bankPending = [];    // unreconciled bank transactions
  let nextTransId = 100;
  let nextInvoiceId = 500;

  // Default demo data
  function initDemoData() {
    if(localStorage.getItem('mw_transactions')) {
      transactions = JSON.parse(localStorage.getItem('mw_transactions'));
      invoices = JSON.parse(localStorage.getItem('mw_invoices'));
      bankPending = JSON.parse(localStorage.getItem('mw_bankPending'));
      nextTransId = localStorage.getItem('mw_nextTransId') ? parseInt(localStorage.getItem('mw_nextTransId')) : 200;
      nextInvoiceId = localStorage.getItem('mw_nextInvoiceId') ? parseInt(localStorage.getItem('mw_nextInvoiceId')) : 600;
      return;
    }
    // Demo transactions last 6 months
    const now = new Date();
    const demoTrans = [
      { id: 1, date: '2026-01-15', desc: 'Property Rent Income', category: 'Rental Revenue', amount: 12500, type: 'income' },
      { id: 2, date: '2026-01-20', desc: 'Maintenance & Repairs', category: 'Expenses', amount: 2300, type: 'expense' },
      { id: 3, date: '2026-02-10', desc: 'Consulting Fees', category: 'Professional Services', amount: 1500, type: 'expense' },
      { id: 4, date: '2026-02-18', desc: 'Tenant Lease', category: 'Rental Revenue', amount: 12800, type: 'income' },
      { id: 5, date: '2026-03-05', desc: 'Utility Bills', category: 'Utilities', amount: 890, type: 'expense' },
      { id: 6, date: '2026-03-22', desc: 'Property Sale Income', category: 'Sales', amount: 45000, type: 'income' },
      { id: 7, date: '2026-04-12', desc: 'Payroll - staff', category: 'Payroll', amount: 6200, type: 'expense' },
      { id: 8, date: '2026-04-28', desc: 'Rental Income', category: 'Rental Revenue', amount: 13200, type: 'income' },
      { id: 9, date: '2026-05-07', desc: 'Tax Payment', category: 'Tax', amount: 3400, type: 'expense' },
      { id: 10, date: '2026-05-19', desc: 'Lease Renewal Fees', category: 'Misc', amount: 1250, type: 'expense' },
      { id: 11, date: '2026-06-01', desc: 'June Rent Income', category: 'Rental Revenue', amount: 13500, type: 'income' },
      { id: 12, date: '2026-06-10', desc: 'Inventory Purchase', category: 'Inventory', amount: 1750, type: 'expense' },
    ];
    transactions = demoTrans;
    nextTransId = 200;

    invoices = [
      { id: 501, client: 'Alpha Holdings', amount: 4200, status: 'Paid', date: '2026-05-10', due: '2026-05-30' },
      { id: 502, client: 'Mwarokin Tenant A', amount: 2800, status: 'Pending', date: '2026-06-05', due: '2026-06-25' },
      { id: 503, client: 'Estates Management', amount: 1500, status: 'Paid', date: '2026-04-20', due: '2026-05-05' },
    ];
    nextInvoiceId = 600;

    bankPending = [
      { id: 'b1', date: '2026-06-07', description: 'Bank Deposit - Rent', amount: 13500, reconciled: false },
      { id: 'b2', date: '2026-06-08', description: 'Check #1024 - Repairs', amount: 870, reconciled: false },
      { id: 'b3', date: '2026-06-09', description: 'EFT - Contractor', amount: 2400, reconciled: false },
    ];
    localStorage.setItem('mw_transactions', JSON.stringify(transactions));
    localStorage.setItem('mw_invoices', JSON.stringify(invoices));
    localStorage.setItem('mw_bankPending', JSON.stringify(bankPending));
    localStorage.setItem('mw_nextTransId', nextTransId);
    localStorage.setItem('mw_nextInvoiceId', nextInvoiceId);
  }

  function saveAllData() {
    localStorage.setItem('mw_transactions', JSON.stringify(transactions));
    localStorage.setItem('mw_invoices', JSON.stringify(invoices));
    localStorage.setItem('mw_bankPending', JSON.stringify(bankPending));
    localStorage.setItem('mw_nextTransId', nextTransId);
    localStorage.setItem('mw_nextInvoiceId', nextInvoiceId);
  }

  // helpers
  function getTotals() {
    let totalIncome = 0, totalExpense = 0;
    transactions.forEach(t => {
      if(t.type === 'income') totalIncome += t.amount;
      else totalExpense += t.amount;
    });
    return { totalIncome, totalExpense, netProfit: totalIncome - totalExpense };
  }

  function getMonthlyChartData() {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
    const incomeMap = [0,0,0,0,0,0];
    const expenseMap = [0,0,0,0,0,0];
    transactions.forEach(t => {
      const d = new Date(t.date);
      const monthIdx = d.getMonth();
      if(monthIdx >=0 && monthIdx <=5) {
        if(t.type === 'income') incomeMap[monthIdx] += t.amount;
        else expenseMap[monthIdx] += t.amount;
      }
    });
    return { months, incomeMap, expenseMap };
  }

  let chartInstance = null;
  function renderDashboard() {
    const { totalIncome, totalExpense, netProfit } = getTotals();
    const incomeReceivable = invoices.filter(i => i.status === 'Pending').reduce((sum,i)=>sum+i.amount,0);
    const pendingRecon = bankPending.filter(b=>!b.reconciled).length;
    const html = `
      <div class="metrics-grid">
        <div class="premium-card metric-card"><div class="metric-title"><i class="fas fa-dollar-sign"></i> Total Income</div><div class="metric-value">$${totalIncome.toLocaleString()}</div></div>
        <div class="premium-card metric-card"><div class="metric-title"><i class="fas fa-chart-line"></i> Total Expenses</div><div class="metric-value">$${totalExpense.toLocaleString()}</div></div>
        <div class="premium-card metric-card"><div class="metric-title"><i class="fas fa-coins"></i> Net Profit</div><div class="metric-value" style="color:${netProfit>=0?'#1f7840':'#b91c1c'}">$${netProfit.toLocaleString()}</div></div>
        <div class="premium-card metric-card"><div class="metric-title"><i class="fas fa-receipt"></i> Pending Invoices</div><div class="metric-value">$${incomeReceivable.toLocaleString()}</div></div>
      </div>
      <div class="grid-2col" style="margin-bottom: 28px;">
        <div class="premium-card" style="padding: 18px;"><canvas id="monthlyChart" height="200"></canvas></div>
        <div class="insight-card"><i class="fas fa-robot" style="font-size: 1.8rem; opacity:0.9;"></i><h3 style="margin: 12px 0 8px;">AI Financial Insight</h3><p>• Based on Q2 trends, rental income increased 7% 📈<br>• Optimize maintenance by 12% using predictive AI<br>• Automate invoice reminders to reduce pending payments by 40%</p><div style="margin-top:12px;"><i class="fas fa-lightbulb"></i> Smart suggestion: Review tax deductions for property upgrades.</div></div>
      </div>
      <div class="premium-card" style="padding: 20px;">
        <div class="flex-between"><h3><i class="fas fa-history"></i> Recent Transactions</h3><button id="viewAllTransBtn" class="btn-outline">View All</button></div>
        <table class="data-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead><tbody id="recentTransBody"></tbody></table>
      </div>
      <div class="grid-2col" style="margin-top: 28px;">
        <div class="premium-card" style="padding: 20px;"><h3><i class="fas fa-users"></i> Payroll Summary (June)</h3><p>👥 Staff count: 8 <br> 💰 Gross Payroll: $12,450<br> 🧾 Benefits & taxes: $2,180<br> ✅ Integrated with Xero-ready export</p></div>
        <div class="premium-card" style="padding: 20px;"><h3><i class="fas fa-boxes"></i> Inventory Status</h3><p>🛋️ Property Supplies: 42 units ($3,200)<br>🔧 Maintenance kits: 28 units ($1,540)<br>📦 Fast-moving: Smart locks ($6,200)<br> AI reorder alert: below threshold</p></div>
      </div>
    `;
    document.getElementById('dashboardView').innerHTML = html;
    const recentBody = document.getElementById('recentTransBody');
    if(recentBody) {
      recentBody.innerHTML = transactions.slice(-5).reverse().map(t => `<tr><td>${t.date}</td><td>${t.desc}</td><td>${t.category}</td><td style="color:${t.type=='income'?'#2b7e3a':'#b91c1c'}">${t.type=='income'?'+':'-'}$${t.amount.toLocaleString()}</td></tr>`).join('');
    }
    const chartData = getMonthlyChartData();
    const ctx = document.getElementById('monthlyChart')?.getContext('2d');
    if(ctx) {
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar', data: { labels: chartData.months, datasets: [{ label: 'Income', data: chartData.incomeMap, backgroundColor: '#D4AF37', borderRadius: 12 },{ label: 'Expenses', data: chartData.expenseMap, backgroundColor: '#2c5a6e', borderRadius: 12 }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
      });
    }
    document.getElementById('viewAllTransBtn')?.addEventListener('click',()=> switchTab('transactions'));
  }

  function renderTransactions() {
    const html = `<div class="premium-card" style="padding: 24px;"><div class="flex-between"><h2><i class="fas fa-list-ul"></i> General Ledger</h2><button id="newTransactionBtn" class="btn-primary"><i class="fas fa-plus"></i> Add Transaction</button></div>
    <table class="data-table" style="margin-top:24px;"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Type</th><th>Actions</th></tr></thead><tbody id="transTableBody"></tbody></table></div>
    <div id="transModal" class="hidden modal-bg"><div class="modal-card"><h3>Transaction</h3><input type="date" id="transDate" class="full-width"><input type="text" id="transDesc" placeholder="Description"><input type="text" id="transCat" placeholder="Category"><input type="number" id="transAmount" placeholder="Amount"><select id="transType"><option value="income">Income</option><option value="expense">Expense</option></select><div style="margin-top:16px;"><button id="saveTransBtn" class="btn-primary">Save</button><button id="closeModalBtn" class="btn-outline">Cancel</button></div></div></div>`;
    document.getElementById('transactionsView').innerHTML = html;
    const tbody = document.getElementById('transTableBody');
    function refreshTable() {
      tbody.innerHTML = transactions.map(t => `<tr><td>${t.date}</td><td>${t.desc}</td><td>${t.category}</td><td style="font-weight:600">$${t.amount.toLocaleString()}</td><td><span class="badge ${t.type=='income'?'badge-success':''}">${t.type}</span></td><td><button class="btn-sm editTrans" data-id="${t.id}"><i class="fas fa-edit"></i></button><button class="btn-sm deleteTrans" data-id="${t.id}"><i class="fas fa-trash-alt"></i></button></td></tr>`).join('');
      attachTransEvents();
    }
    function attachTransEvents() {
      document.querySelectorAll('.deleteTrans').forEach(btn => btn.addEventListener('click',(e)=>{
        const id = parseInt(btn.dataset.id);
        transactions = transactions.filter(t=>t.id !== id);
        saveAllData(); refreshTable(); renderDashboard(); if(activeTab==='transactions') refreshTable();
      }));
      document.querySelectorAll('.editTrans').forEach(btn=>btn.addEventListener('click',()=>{
        const id = parseInt(btn.dataset.id);
        const trans = transactions.find(t=>t.id===id);
        if(trans){ document.getElementById('transDate').value = trans.date; document.getElementById('transDesc').value = trans.desc; document.getElementById('transCat').value = trans.category; document.getElementById('transAmount').value = trans.amount; document.getElementById('transType').value = trans.type;
          const modal = document.getElementById('transModal'); modal.classList.remove('hidden');
          const saveBtn = document.getElementById('saveTransBtn'); const oldSave = saveBtn.onclick;
          saveBtn.onclick = () => {
            trans.date = document.getElementById('transDate').value; trans.desc = document.getElementById('transDesc').value; trans.category = document.getElementById('transCat').value; trans.amount = parseFloat(document.getElementById('transAmount').value); trans.type = document.getElementById('transType').value;
            saveAllData(); refreshTable(); renderDashboard(); modal.classList.add('hidden'); saveBtn.onclick = null; window.addTransHandler();
          };
        }
      }));
    }
    window.addTransHandler = function(){
      const date = document.getElementById('transDate').value, desc = document.getElementById('transDesc').value, cat = document.getElementById('transCat').value, amount = parseFloat(document.getElementById('transAmount').value), type = document.getElementById('transType').value;
      if(!date||!desc||!amount) return;
      transactions.push({ id: nextTransId++, date, desc: desc, category: cat, amount, type });
      saveAllData(); refreshTable(); renderDashboard(); document.getElementById('transModal').classList.add('hidden');
    };
    document.getElementById('newTransactionBtn').onclick = ()=>{
      document.getElementById('transDate').value = new Date().toISOString().slice(0,10);
      document.getElementById('transDesc').value = ''; document.getElementById('transCat').value=''; document.getElementById('transAmount').value=''; document.getElementById('transType').value='expense';
      const modal = document.getElementById('transModal'); modal.classList.remove('hidden');
      document.getElementById('saveTransBtn').onclick = window.addTransHandler;
    };
    document.getElementById('closeModalBtn')?.addEventListener('click',()=>document.getElementById('transModal').classList.add('hidden'));
    refreshTable();
  }

  function renderInvoices() {
    const html = `<div class="premium-card" style="padding:24px"><div class="flex-between"><h2><i class="fas fa-file-invoice"></i> Invoicing Hub</h2><button id="createInvoiceBtn" class="btn-primary"><i class="fas fa-plus"></i> New Invoice</button></div>
    <table class="data-table"><thead><tr><th>ID</th><th>Client</th><th>Amount</th><th>Issue Date</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody id="invoiceListBody"></tbody></table></div>
    <div id="invoiceModal" class="hidden modal-bg"><div class="modal-card"><h3>New Invoice</h3><input id="invClient" placeholder="Client name"><input id="invAmount" type="number" placeholder="Amount"><input id="invDate" type="date"><input id="invDue" type="date"><select id="invStatus"><option>Pending</option><option>Paid</option></select><button id="saveInvoiceBtn" class="btn-primary">Generate</button><button id="closeInvModal" class="btn-outline">Cancel</button></div></div>`;
    document.getElementById('invoicesView').innerHTML = html;
    function refreshInvTable() {
      const tbody = document.getElementById('invoiceListBody');
      tbody.innerHTML = invoices.map(inv => `<tr><td>#${inv.id}</td><td>${inv.client}</td><td>$${inv.amount}</td><td>${inv.date}</td><td>${inv.due}</td><td><span class="badge ${inv.status==='Paid'?'badge-success':''}">${inv.status}</span></td><td><button class="btn-sm markPaidBtn" data-id="${inv.id}" ${inv.status==='Paid'?'disabled':''}><i class="fas fa-check-circle"></i> Mark Paid</button></td></tr>`).join('');
      document.querySelectorAll('.markPaidBtn').forEach(btn=>btn.addEventListener('click',(e)=>{
        const id = parseInt(btn.dataset.id);
        const inv = invoices.find(i=>i.id===id);
        if(inv && inv.status !== 'Paid'){ inv.status = 'Paid'; saveAllData(); refreshInvTable(); renderDashboard(); }
      }));
    }
    document.getElementById('createInvoiceBtn').onclick = ()=>{
      const modal = document.getElementById('invoiceModal'); modal.classList.remove('hidden');
      document.getElementById('saveInvoiceBtn').onclick = ()=>{
        const client = document.getElementById('invClient').value, amount = parseFloat(document.getElementById('invAmount').value), date = document.getElementById('invDate').value, due = document.getElementById('invDue').value, status = document.getElementById('invStatus').value;
        if(!client||!amount) return;
        invoices.push({ id: nextInvoiceId++, client, amount, status, date, due });
        saveAllData(); refreshInvTable(); modal.classList.add('hidden'); renderDashboard();
      };
    };
    document.getElementById('closeInvModal')?.addEventListener('click',()=>document.getElementById('invoiceModal').classList.add('hidden'));
    refreshInvTable();
  }

  function renderBanking() {
    const pendingItems = bankPending.filter(b=>!b.reconciled);
    const html = `<div class="premium-card" style="padding:24px"><h2><i class="fas fa-building-columns"></i> Bank Reconciliation & Feeds</h2><p>Sync with bank accounts · Multi-currency ready</p><div style="margin:20px 0"><h3>Pending Reconciliation (${pendingItems.length})</h3><ul id="pendingBankList" style="list-style:none;"></ul><button id="reconcileAllBtn" class="btn-primary" style="margin-top:12px">Reconcile Selected (Match Ledger)</button></div><div class="insight-card" style="margin-top:20px; background:#eef3fc; color:#1e2a3e"><i class="fas fa-credit-card"></i> <strong>Auto-matching AI:</strong> 92% of transactions automatically matched. Bank feed active: Equity Bank</div></div>`;
    document.getElementById('bankingView').innerHTML = html;
    const listContainer = document.getElementById('pendingBankList');
    function refreshPending() {
      const newPending = bankPending.filter(b=>!b.reconciled);
      if(listContainer) listContainer.innerHTML = newPending.map((b,idx)=>`<li style="padding:12px; border-bottom:1px solid #e2e8f0;"><input type="checkbox" class="reconCheckbox" data-idx="${idx}" data-real-id="${b.id}"> <strong>${b.date}</strong> - ${b.description} : $${b.amount}</li>`).join('');
    }
    refreshPending();
    document.getElementById('reconcileAllBtn')?.addEventListener('click',()=>{
      const checkboxes = document.querySelectorAll('.reconCheckbox:checked');
      checkboxes.forEach(cb => {
        const realId = cb.getAttribute('data-real-id');
        const idx = bankPending.findIndex(b=>b.id === realId);
        if(idx !== -1) bankPending[idx].reconciled = true;
      });
      saveAllData();
      refreshPending();
      renderDashboard();
    });
  }

  function renderReports() {
    const { totalIncome, totalExpense, netProfit } = getTotals();
    const taxEstimate = netProfit * 0.21;
    const html = `<div class="grid-2col">
      <div class="premium-card" style="padding:24px"><h3>Profit & Loss Statement</h3><hr/><p>Total Income: <strong>$${totalIncome.toLocaleString()}</strong></p><p>Total Expenses: <strong>$${totalExpense.toLocaleString()}</strong></p><p><strong>Net Profit: $${netProfit.toLocaleString()}</strong></p><button id="genTaxReport" class="btn-primary" style="margin-top:12px">Generate Tax Summary</button><div id="taxSummary"></div></div>
      <div class="premium-card" style="padding:24px"><h3>VAT / Tax Compliance</h3><p>Estimated Corporate Tax (21%): $${taxEstimate.toLocaleString()}</p><p>GST/VAT Collected: $2,840</p><p>Multi-currency reports: KES, USD, EUR supported<br>✅ Xero/Zoho Books Integration Ready</p><p><i class="fas fa-chart-pie"></i> AI Tax Optimizer: Potential deductions $4,200</p></div>
    </div>`;
    document.getElementById('reportsView').innerHTML = html;
    document.getElementById('genTaxReport')?.addEventListener('click',()=>{
      document.getElementById('taxSummary').innerHTML = `<div class="badge" style="margin-top:12px;">📄 Tax projection: ${new Date().getFullYear()} - Estimated liability: $${(netProfit*0.21).toLocaleString()}. Filing deadline 30 Sep.</div>`;
    });
  }

  let activeTab = 'dashboard';
  function switchTab(tabId) {
    activeTab = tabId;
    document.querySelectorAll('.nav-item').forEach(item=>item.classList.remove('active'));
    document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('transactionsView').classList.add('hidden');
    document.getElementById('invoicesView').classList.add('hidden');
    document.getElementById('bankingView').classList.add('hidden');
    document.getElementById('reportsView').classList.add('hidden');
    if(tabId === 'dashboard') { document.getElementById('dashboardView').classList.remove('hidden'); renderDashboard(); document.getElementById('currentPageTitle').innerText = 'Dashboard'; }
    if(tabId === 'transactions') { document.getElementById('transactionsView').classList.remove('hidden'); renderTransactions(); document.getElementById('currentPageTitle').innerText = 'Transactions Ledger'; }
    if(tabId === 'invoices') { document.getElementById('invoicesView').classList.remove('hidden'); renderInvoices(); document.getElementById('currentPageTitle').innerText = 'Invoicing Suite'; }
    if(tabId === 'banking') { document.getElementById('bankingView').classList.remove('hidden'); renderBanking(); document.getElementById('currentPageTitle').innerText = 'Bank Reconciliation'; }
    if(tabId === 'reports') { document.getElementById('reportsView').classList.remove('hidden'); renderReports(); document.getElementById('currentPageTitle').innerText = 'Reports & Tax'; }
  }

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => { switchTab(item.dataset.tab); });
  });

  initDemoData();
  switchTab('dashboard');
  window.addEventListener('beforeunload',()=>saveAllData());
</script>
</body>
</html>
