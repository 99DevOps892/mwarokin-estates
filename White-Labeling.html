<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mwarokin Estates · White Label Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --navy:#0e1a2b; --navy-light:#16283f; --navy-softer:#1e3352; --navy-deep:#081120;
  --gold:#c9a959; --gold-light:#e8d5a3; --gold-dim:#8a6a2a; --gold-glow:rgba(201,169,89,.25);
  --cream:#f8f5ee; --white:#ffffff;
  --gray-100:#f3f1ed; --gray-200:#e8e4dc; --gray-300:#d0cbc2; --gray-600:#6b6560; --gray-800:#2d2823;
  --green:#2f7d5e; --green-bg:#e7f3ed;
  --amber:#b9822f; --amber-bg:#f7ecd8;
  --red:#b3462c; --red-bg:#f6e6e1;
  --blue:#2f5f8a; --blue-bg:#e6eef5;
  --shadow-sm:0 4px 20px rgba(14,26,43,.08);
  --shadow-md:0 12px 48px rgba(14,26,43,.12);
  --shadow-lg:0 24px 64px rgba(14,26,43,.2);
}
*{box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; margin:0; padding:0;}
.serif{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
html,body{background:var(--cream);}
body{
  background-image:
    radial-gradient(ellipse at 6% 4%, rgba(201,169,89,.08) 0%, transparent 45%),
    radial-gradient(ellipse at 97% 95%, rgba(14,26,43,.06) 0%, transparent 45%);
  color:var(--gray-800); min-height:100vh;
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--gray-300); border-radius:10px;}
.fade-in{animation:fadeIn .4s;} @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.pop-in{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;} @keyframes popIn{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.slide-in{animation:slideIn .35s cubic-bezier(.25,.46,.45,.94) forwards;} @keyframes slideIn{from{transform:translateY(-8px) translateX(8px);opacity:0;}to{transform:translateY(0) translateX(0);opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}} .spin{animation:spin 1s linear infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ===== App shell ===== */
.shell{display:grid; grid-template-columns:264px 1fr; min-height:100vh;}
@media(max-width:960px){.shell{grid-template-columns:1fr;}}

.sidebar{background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); padding:26px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:22px;}
@media(max-width:960px){.sidebar{position:relative; height:auto;}}
.brand-row{display:flex; align-items:center; gap:12px; padding:0 6px;}
.brand-icon{width:42px;height:42px;background:var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--navy);flex-shrink:0; box-shadow:0 6px 16px rgba(201,169,89,.35);}
.brand-title{font-size:14.5px; font-weight:700; color:#fff; line-height:1.25;}
.brand-sub{font-size:10.5px; color:rgba(255,255,255,.5); letter-spacing:.3px;}

.nav-group{display:flex; flex-direction:column; gap:3px;}
.nav-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:rgba(255,255,255,.35); padding:10px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:rgba(255,255,255,.68); font-size:13px; font-weight:600; cursor:pointer; transition:.2s; position:relative;}
.nav-item i{width:16px; text-align:center; font-size:13.5px;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(201,169,89,.14); color:var(--gold-light);}
.nav-item.active::before{content:'';position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--gold);border-radius:2px;}

.client-card{margin-top:auto; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:14px;}
.client-card .cc-tier{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--gold-light); background:rgba(201,169,89,.15); display:inline-block; padding:3px 9px; border-radius:100px; margin-bottom:8px;}
.client-card .cc-name{font-size:13px; font-weight:700; color:#fff;}
.client-card .cc-sub{font-size:11px; color:rgba(255,255,255,.5); margin-top:2px;}

.main{padding:26px 30px 60px; max-width:1180px;}
@media(max-width:600px){.main{padding:18px 14px 44px;}}

.topbar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:14px; margin-bottom:22px;}
.topbar h1{font-size:21px; font-weight:700; color:var(--navy);}
.topbar p{font-size:12.5px; color:var(--gray-600); margin-top:2px;}

.btn{border:none; border-radius:100px; padding:11px 20px; font-weight:700; font-size:13px; cursor:pointer; transition:.25s; display:inline-flex; align-items:center; gap:8px;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-softer); transform:translateY(-2px); box-shadow:0 8px 22px rgba(14,26,43,.22);}
.btn-gold{background:var(--gold); color:var(--navy);}
.btn-gold:hover{background:#dbb96a; box-shadow:0 8px 22px rgba(201,169,89,.35); transform:translateY(-2px);}
.btn-ghost{background:transparent; border:1.5px solid var(--gray-200); color:var(--navy);}
.btn-ghost:hover{border-color:var(--gold); background:var(--gray-100);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none!important; box-shadow:none!important;}

/* ===== Card ===== */
.card{background:var(--white); border-radius:18px; box-shadow:var(--shadow-sm); border:1px solid var(--gray-200); padding:22px;}
.card-title{font-size:15px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:9px; margin-bottom:4px;}
.card-sub{font-size:12px; color:var(--gray-600); margin-bottom:16px;}

.grid2{display:grid; grid-template-columns:1fr; gap:20px;}
@media(min-width:1000px){.grid2{grid-template-columns:1fr 1fr;}}
.grid2.wide-left{grid-template-columns:1fr;}
@media(min-width:1000px){.grid2.wide-left{grid-template-columns:1.2fr .8fr;}}

/* ===== Form elements ===== */
.f-label{font-size:12px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.f-input, .f-select{width:100%; border:1.5px solid var(--gray-200); background:var(--gray-100); border-radius:10px; padding:10px 13px; font-size:13.5px; color:var(--gray-800); transition:.25s; outline:none;}
.f-input:focus, .f-select:focus{border-color:var(--gold); background:#fff; box-shadow:0 0 0 4px var(--gold-glow);}
.f-group{margin-bottom:15px;}
.f-hint{font-size:11px; color:var(--gray-600); margin-top:5px;}

/* Color swatch row */
.swatch-row{display:flex; align-items:center; gap:12px; padding:11px 13px; border:1.5px solid var(--gray-200); border-radius:12px; margin-bottom:10px; transition:.2s;}
.swatch-row:hover{border-color:var(--gold-light);}
.swatch{width:38px; height:38px; border-radius:10px; border:2px solid rgba(0,0,0,.06); cursor:pointer; flex-shrink:0; padding:0;}
.swatch-meta{flex:1;}
.swatch-meta .sm-name{font-size:12.5px; font-weight:700; color:var(--navy);}
.swatch-meta .sm-hex{font-size:11px; color:var(--gray-600); font-family:'JetBrains Mono',monospace;}

/* Preset gallery */
.preset-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media(max-width:520px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
.preset{border-radius:13px; padding:14px 10px; cursor:pointer; text-align:center; font-size:11.5px; font-weight:700; color:#fff; transition:.25s; position:relative; border:2px solid transparent;}
.preset:hover{transform:translateY(-3px); box-shadow:var(--shadow-sm);}
.preset.active{border-color:var(--navy); box-shadow:0 0 0 3px var(--gold-glow);}
.preset .pchk{position:absolute; top:6px; right:6px; width:16px; height:16px; border-radius:50%; background:#fff; color:var(--navy); font-size:9px; display:flex; align-items:center; justify-content:center; opacity:0;}
.preset.active .pchk{opacity:1;}

/* ===== Live preview mockup ===== */
.preview-frame{border-radius:18px; overflow:hidden; border:8px solid var(--navy-deep); box-shadow:var(--shadow-lg); background:#fff;}
.preview-browserbar{background:var(--navy-deep); padding:9px 12px; display:flex; align-items:center; gap:6px;}
.preview-dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.25);}
.preview-url{margin-left:8px; background:rgba(255,255,255,.08); border-radius:6px; padding:3px 10px; font-size:10px; color:rgba(255,255,255,.55); font-family:'JetBrains Mono',monospace; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pv-body{padding:0;}
.pv-header{padding:16px 18px; display:flex; align-items:center; justify-content:space-between;}
.pv-logo{display:flex; align-items:center; gap:9px;}
.pv-logo-badge{width:32px;height:32px;border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff;}
.pv-logo-name{font-weight:800; font-size:14px;}
.pv-nav-pill{padding:6px 14px; border-radius:100px; font-size:10.5px; font-weight:700; color:#fff;}
.pv-hero{padding:22px 18px; }
.pv-hero-tag{display:inline-block; font-size:9.5px; font-weight:700; padding:4px 10px; border-radius:100px; margin-bottom:9px;}
.pv-hero-title{font-size:17px; font-weight:800; color:var(--gray-800); line-height:1.3; margin-bottom:6px;}
.pv-hero-sub{font-size:11.5px; color:var(--gray-600); margin-bottom:12px;}
.pv-btn{display:inline-block; padding:8px 18px; border-radius:100px; font-size:11px; font-weight:700; color:#fff;}
.pv-cards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:0 18px 20px;}
.pv-card{border-radius:12px; padding:12px; background:var(--gray-100); border-left:3px solid; }
.pv-card .pvc-t{font-size:11px; font-weight:700; color:var(--gray-800);}
.pv-card .pvc-s{font-size:10px; color:var(--gray-600); margin-top:2px;}

/* Domain */
.domain-preview{display:flex; align-items:center; gap:0; border:1.5px solid var(--gray-200); border-radius:11px; overflow:hidden; background:var(--gray-100);}
.domain-preview input{border:none; background:transparent; padding:11px 12px; font-size:13.5px; font-family:'JetBrains Mono',monospace; outline:none; flex:1; min-width:0;}
.domain-preview .dp-suffix{padding:11px 12px; background:var(--gray-200); font-size:12.5px; color:var(--gray-600); font-family:'JetBrains Mono',monospace; white-space:nowrap;}
.dns-row{display:flex; justify-content:space-between; gap:10px; padding:10px 13px; background:var(--gray-100); border-radius:9px; margin-bottom:8px; font-size:12px; font-family:'JetBrains Mono',monospace; flex-wrap:wrap;}
.dns-row span:first-child{color:var(--gray-600); font-weight:700;}

/* Status pill */
.pill{padding:4px 12px; border-radius:100px; font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; gap:5px;}
.pill-active{background:var(--green-bg); color:var(--green);}
.pill-pending{background:var(--amber-bg); color:var(--amber);}
.pill-available{background:var(--green-bg); color:var(--green);}
.pill-verifying{background:var(--amber-bg); color:var(--amber);}

/* Listing / feature cards */
.listing-card2{background:var(--gray-100); border-radius:13px; padding:15px; border-left:4px solid var(--navy); position:relative; transition:.25s;}
.listing-card2:hover{background:#fff; box-shadow:var(--shadow-sm); transform:translateY(-2px);}
.listing-id2{font-weight:700; color:var(--navy); font-size:13px; margin-bottom:4px;}
.listing-tenant2{font-size:11.5px; color:var(--gray-600);}
.listing-price2{font-weight:800; color:var(--gold-dim); margin-top:7px; font-family:'JetBrains Mono',monospace;}

/* API key box */
.key-box{display:flex; align-items:center; gap:10px; background:var(--navy-deep); border-radius:12px; padding:13px 16px;}
.key-box .kv{flex:1; font-family:'JetBrains Mono',monospace; color:var(--gold-light); font-size:13px; letter-spacing:.3px; overflow-x:auto; white-space:nowrap;}
.key-btn{background:rgba(255,255,255,.08); border:none; color:#fff; width:32px; height:32px; border-radius:8px; cursor:pointer; flex-shrink:0; transition:.2s;}
.key-btn:hover{background:rgba(255,255,255,.18);}
.code-box{background:var(--navy-deep); color:var(--gold-light); border-radius:12px; padding:14px 16px; font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.7; overflow-x:auto; white-space:pre;}

/* Plan tiers */
.tier-card{border:2px solid var(--gray-200); border-radius:16px; padding:20px; position:relative; transition:.25s;}
.tier-card.current{border-color:var(--gold); background:linear-gradient(180deg, rgba(201,169,89,.06), transparent);}
.tier-badge{position:absolute; top:-11px; left:16px; background:var(--gold); color:var(--navy); font-size:10px; font-weight:800; padding:3px 11px; border-radius:100px;}
.tier-name{font-size:15px; font-weight:800; color:var(--navy);}
.tier-price{font-size:22px; font-weight:800; color:var(--gold-dim); margin:6px 0 3px; font-family:'JetBrains Mono',monospace;}
.tier-list{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
.tier-list li{list-style:none; font-size:12px; color:var(--gray-600); display:flex; gap:7px; align-items:flex-start;}

/* Usage meter */
.meter{height:8px; border-radius:100px; background:var(--gray-200); overflow:hidden; margin-top:6px;}
.meter-fill{height:100%; border-radius:100px; background:linear-gradient(90deg, var(--gold), var(--gold-dim));}

/* Notifications */
.notification{position:fixed; top:20px; right:20px; z-index:1200; max-width:380px;}
.notif-box{border-radius:14px; padding:15px 17px; box-shadow:var(--shadow-lg); display:flex; gap:11px; align-items:flex-start; background:#fff; border-left:4px solid var(--gold); margin-bottom:10px;}
.notif-box.success{border-left-color:var(--green);}
.notif-box.error{border-left-color:var(--red);}
.notif-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12.5px;}
.notif-icon.info{background:var(--gold-glow); color:var(--gold-dim);}
.notif-icon.success{background:var(--green-bg); color:var(--green);}
.notif-icon.error{background:var(--red-bg); color:var(--red);}

.loading-spin{display:inline-block; width:16px; height:16px; border:2.5px solid rgba(14,26,43,.15); border-top-color:var(--navy); border-radius:50%; animation:spin .8s linear infinite;}

textarea.f-input{resize:vertical; min-height:70px; font-family:'JetBrains Mono',monospace; font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const THEME_PRESETS = [
    { id:1, name:'Obsidian Gold', primary:'#0e1a2b', secondary:'#c9a959', accent:'#2f7d5e', grad:'linear-gradient(135deg,#0e1a2b,#1e3352)' },
    { id:2, name:'Ocean Blue', primary:'#4361ee', secondary:'#3a0ca3', accent:'#4cc9f0', grad:'linear-gradient(135deg,#4361ee,#3a0ca3)' },
    { id:3, name:'Purple Pink', primary:'#7209b7', secondary:'#f72585', accent:'#b5179e', grad:'linear-gradient(135deg,#7209b7,#f72585)' },
    { id:4, name:'Savanna Green', primary:'#2a9d8f', secondary:'#264653', accent:'#e9c46a', grad:'linear-gradient(135deg,#2a9d8f,#264653)' },
    { id:5, name:'Coral Sunset', primary:'#e76f51', secondary:'#9c2c1d', accent:'#f4a261', grad:'linear-gradient(135deg,#e76f51,#9c2c1d)' },
    { id:6, name:'Sky Teal', primary:'#2f5f8a', secondary:'#14314a', accent:'#4cc9f0', grad:'linear-gradient(135deg,#2f5f8a,#14314a)' }
];

const FONT_PAIRS = [
    { id:'fraunces-inter', label:'Fraunces + Inter (Editorial)' },
    { id:'poppins-inter', label:'Poppins + Inter (Modern)' },
    { id:'playfair-lato', label:'Playfair + Lato (Classic)' },
    { id:'space-dm', label:'Space Grotesk + DM Sans (Tech)' }
];

const PLAN_TIERS = [
    { id:'msingi', name:'Msingi', price:'KSh 2,500/mo', listings:15, apiCalls:'2,000', storage:'1 GB',
      features:['Up to 15 active listings','Basic branding (logo + 1 color)','Email support','Standard subdomain'] },
    { id:'jengo', name:'Jengo', price:'KSh 6,900/mo', listings:60, apiCalls:'15,000', storage:'10 GB',
      features:['Up to 60 active listings','Full theme customization','Priority support','Custom domain (1)','Lease drafting tools'] },
    { id:'milki', name:'Milki', price:'KSh 15,900/mo', listings:250, apiCalls:'75,000', storage:'50 GB',
      features:['Up to 250 active listings','White-label mobile web app','Dedicated success manager','Custom domain (3) + SSL','Matchmaking AI engine','Webhook automations'] },
    { id:'taifa', name:'Taifa', price:'Custom pricing', listings:'Unlimited', apiCalls:'Unlimited', storage:'500 GB+',
      features:['Unlimited listings & domains','Full API + webhook access','SLA-backed uptime','Dedicated infrastructure','On-boarding & migration support'] }
];

function rid(){ return Math.random().toString(36).slice(2,10).toUpperCase(); }

/* ============================================================
   MOCK API
   ============================================================ */
async function mockApiCall(endpoint){
    await new Promise(r=>setTimeout(r, 650));
    switch(endpoint){
        case '/api/listings':
            return [
                { id:'LST001', tenant_id:'TENANT_A', price:250000, status:'available' },
                { id:'LST002', tenant_id:'TENANT_B', price:320000, status:'available' },
                { id:'LST003', tenant_id:'TENANT_C', price:180000, status:'pending' },
                { id:'LST004', tenant_id:'TENANT_A', price:275000, status:'available' },
                { id:'LST005', tenant_id:'TENANT_D', price:410000, status:'available' }
            ];
        case '/lease/draft':
            return { clauses:['Standard Lease Agreement','Maintenance Responsibilities','Payment Terms'], schedule:{start_date:'2026-08-01', end_date:'2027-07-31', rent:2500}, risks:['Credit Risk','Market Volatility'] };
        case '/matchmaking':
            return [ { listing_id:'LST001', score:92 }, { listing_id:'LST002', score:87 }, { listing_id:'LST004', score:78 } ];
        case '/api/buyer-profile':
            return { id:'BP001', preferences:{ min_price:200000, max_price:350000, location:'Downtown', property_type:'Apartment', bedrooms:2 } };
        default: throw new Error('Endpoint not found');
    }
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function showNotification(message, type='info', title=''){
    const wrap = document.createElement('div');
    wrap.className = 'notification slide-in';
    const iconMap = { info:'fa-info-circle', success:'fa-check-circle', error:'fa-exclamation-circle' };
    wrap.innerHTML = `
        <div class="notif-box ${type}">
            <div class="notif-icon ${type}"><i class="fas ${iconMap[type]||iconMap.info}"></i></div>
            <div style="flex:1;">
                ${title?`<div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:2px;">${title}</div>`:''}
                <p style="font-size:12.5px;line-height:1.5;color:#4a453f;">${message}</p>
            </div>
            <button onclick="this.closest('.notification').remove()" style="background:none;border:none;cursor:pointer;color:var(--gray-600);flex-shrink:0;"><i class="fas fa-times" style="font-size:11px;"></i></button>
        </div>`;
    document.body.appendChild(wrap);
    setTimeout(()=>{ if (wrap.parentElement) wrap.remove(); }, 6000);
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
const STORAGE_KEY = 'mwarokin_whitelabel_config_v1';
function loadConfig(){
    try{
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) return saved;
    }catch(e){}
    return {
        clientName:'Zawadi Properties Ltd',
        tenantId:'TENANT-A17',
        role:'Premium Partner',
        locale:'en-KE',
        currency:'KES',
        theme:{ ...THEME_PRESETS[0] },
        fontPair:'fraunces-inter',
        subdomain:'zawadi',
        customDomain:'',
        domainVerified:false,
        planId:'jengo',
        apiKey:`mwk_live_${rid()}${rid()}`.toLowerCase(),
        webhookUrl:''
    };
}
function saveConfig(cfg){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); }catch(e){} }

/* ============================================================
   MAIN APP
   ============================================================ */
class WhiteLabelStudio{
    constructor(){
        this.state = {
            cfg: loadConfig(),
            activeTab: 'branding',
            listings: [],
            listingsLoading: true,
            leaseResult: null,
            matchResult: null,
            profileResult: null,
            keyVisible: false,
            saving: false
        };
    }

    async init(){
        this.render();
        await this.fetchListings();
    }

    setState(patch){ this.state = { ...this.state, ...patch }; this.render(); }
    cfg(){ return this.state.cfg; }

    async fetchListings(){
        this.setState({ listingsLoading:true });
        try{
            const listings = await mockApiCall('/api/listings');
            this.setState({ listings, listingsLoading:false });
        }catch(e){ this.setState({ listingsLoading:false }); showNotification('Failed to load listings.', 'error'); }
    }

    persistAndNotify(msg){
        saveConfig(this.state.cfg);
        showNotification(msg, 'success', 'Saved');
    }

    /* ---------- RENDER ---------- */
    render(){
        const el = document.getElementById('app');
        el.innerHTML = `
        <div class="shell">
            ${this.renderSidebar()}
            <div class="main">
                ${this.renderTopbar()}
                <div class="fade-in">${this.renderActiveTab()}</div>
            </div>
        </div>`;
        this.setupListeners();
    }

    renderSidebar(){
        const cfg = this.cfg();
        const tier = PLAN_TIERS.find(t=>t.id===cfg.planId) || PLAN_TIERS[0];
        const items = [
            { group:'Brand Studio', tabs:[
                { id:'branding', label:'Branding & Theme', icon:'fa-palette' },
                { id:'domain', label:'Domain & SSL', icon:'fa-globe' }
            ]},
            { group:'Operations', tabs:[
                { id:'listings', label:'Property Listings', icon:'fa-building' },
                { id:'leases', label:'Lease Drafting', icon:'fa-file-signature' },
                { id:'matchmaking', label:'Matchmaking', icon:'fa-people-arrows' }
            ]},
            { group:'Developer', tabs:[
                { id:'api', label:'API & Webhooks', icon:'fa-plug' }
            ]},
            { group:'Account', tabs:[
                { id:'plan', label:'Plan & Usage', icon:'fa-layer-group' }
            ]}
        ];
        return `
        <div class="sidebar">
            <div class="brand-row">
                <div class="brand-icon"><i class="fas fa-building-shield"></i></div>
                <div>
                    <div class="brand-title">Mwarokin Estates</div>
                    <div class="brand-sub">White Label Studio</div>
                </div>
            </div>
            ${items.map(g=>`
                <div class="nav-group">
                    <div class="nav-label">${g.group}</div>
                    ${g.tabs.map(t=>`
                        <div class="nav-item ${this.state.activeTab===t.id?'active':''}" data-tab="${t.id}">
                            <i class="fas ${t.icon}"></i>${t.label}
                        </div>`).join('')}
                </div>
            `).join('')}
            <div class="client-card">
                <span class="cc-tier">${tier.name} plan</span>
                <div class="cc-name">${cfg.clientName}</div>
                <div class="cc-sub">${cfg.tenantId} · ${cfg.role}</div>
            </div>
        </div>`;
    }

    renderTopbar(){
        const titles = {
            branding:['Branding & Theme','Shape how your clients experience the Mwarokin platform under your own identity.'],
            domain:['Domain & SSL','Serve your white-labeled portal from your own web address.'],
            listings:['Property Listings','All active and pending listings synced across your portfolio.'],
            leases:['Lease Drafting','Generate a lease draft instantly for any listing and applicant.'],
            matchmaking:['Matchmaking','Surface the best-fit listings for a given buyer profile.'],
            api:['API & Webhooks','Connect your own systems to the Mwarokin platform.'],
            plan:['Plan & Usage','Review your subscription tier and current usage.']
        };
        const [title, sub] = titles[this.state.activeTab];
        return `
        <div class="topbar">
            <div>
                <h1 class="serif">${title}</h1>
                <p>${sub}</p>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-ghost" id="refreshBtn"><i class="fas fa-sync-alt"></i>Refresh</button>
                <button class="btn btn-gold" id="publishBtn" ${this.state.saving?'disabled':''}>
                    ${this.state.saving?'<span class="loading-spin"></span> Publishing…':'<i class="fas fa-rocket"></i> Publish changes'}
                </button>
            </div>
        </div>`;
    }

    renderActiveTab(){
        const map = { branding:'renderBranding', domain:'renderDomain', listings:'renderListings', leases:'renderLeases', matchmaking:'renderMatchmaking', api:'renderApi', plan:'renderPlan' };
        return this[map[this.state.activeTab]]();
    }

    /* ---------- BRANDING ---------- */
    renderBranding(){
        const cfg = this.cfg();
        const t = cfg.theme;
        return `
        <div class="grid2 wide-left">
            <div style="display:flex;flex-direction:column;gap:18px;">
                <div class="card">
                    <div class="card-title"><i class="fas fa-signature" style="color:var(--gold);"></i>Client identity</div>
                    <div class="card-sub">Shown across the portal header, receipts, and notifications.</div>
                    <div class="f-group"><label class="f-label">Client / company name</label>
                        <input type="text" id="clientNameInput" class="f-input" value="${cfg.clientName}" placeholder="e.g. Zawadi Properties Ltd" /></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                        <div class="f-group"><label class="f-label">Locale</label>
                            <select id="localeSelect" class="f-select">
                                ${['en-KE','en-NG','en-GH','en-ZA','en-US','fr-CI'].map(l=>`<option value="${l}" ${cfg.locale===l?'selected':''}>${l}</option>`).join('')}
                            </select></div>
                        <div class="f-group"><label class="f-label">Currency</label>
                            <select id="currencySelect" class="f-select">
                                ${['KES','NGN','GHS','ZAR','USD'].map(c=>`<option value="${c}" ${cfg.currency===c?'selected':''}>${c}</option>`).join('')}
                            </select></div>
                    </div>
                    <div class="f-group"><label class="f-label">Typography pairing</label>
                        <select id="fontSelect" class="f-select">
                            ${FONT_PAIRS.map(f=>`<option value="${f.id}" ${cfg.fontPair===f.id?'selected':''}>${f.label}</option>`).join('')}
                        </select></div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-palette" style="color:var(--gold);"></i>Colors</div>
                    <div class="card-sub">Tap a swatch to pick a color — the preview updates instantly.</div>
                    <div class="swatch-row">
                        <input type="color" class="swatch" id="primaryColor" value="${t.primary}" />
                        <div class="swatch-meta"><div class="sm-name">Primary</div><div class="sm-hex" id="primaryHex">${t.primary}</div></div>
                    </div>
                    <div class="swatch-row">
                        <input type="color" class="swatch" id="secondaryColor" value="${t.secondary}" />
                        <div class="swatch-meta"><div class="sm-name">Secondary</div><div class="sm-hex" id="secondaryHex">${t.secondary}</div></div>
                    </div>
                    <div class="swatch-row">
                        <input type="color" class="swatch" id="accentColor" value="${t.accent}" />
                        <div class="swatch-meta"><div class="sm-name">Accent</div><div class="sm-hex" id="accentHex">${t.accent}</div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-swatchbook" style="color:var(--gold);"></i>Theme presets</div>
                    <div class="card-sub">Start from a curated palette, then fine-tune above.</div>
                    <div class="preset-grid">
                        ${THEME_PRESETS.map(p=>`
                            <div class="preset ${t.primary===p.primary && t.secondary===p.secondary?'active':''}" style="background:${p.grad};" data-preset="${p.id}">
                                <div class="pchk"><i class="fas fa-check"></i></div>
                                ${p.name}
                            </div>`).join('')}
                    </div>
                </div>
            </div>

            <div>
                <div class="card" style="position:sticky;top:20px;">
                    <div class="card-title"><i class="fas fa-eye" style="color:var(--gold);"></i>Live preview</div>
                    <div class="card-sub">This is what ${cfg.clientName || 'your'} tenants will see.</div>
                    ${this.renderPreviewFrame()}
                </div>
            </div>
        </div>`;
    }

    renderPreviewFrame(){
        const cfg = this.cfg();
        const t = cfg.theme;
        const url = `${cfg.subdomain||'yourbrand'}.mwarokinestates.africa`;
        const initials = (cfg.clientName||'M E').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
        return `
        <div class="preview-frame">
            <div class="preview-browserbar">
                <span class="preview-dot"></span><span class="preview-dot"></span><span class="preview-dot"></span>
                <span class="preview-url"><i class="fas fa-lock" style="font-size:8px;margin-right:5px;"></i>${url}</span>
            </div>
            <div class="pv-body">
                <div class="pv-header" style="background:${t.primary};">
                    <div class="pv-logo">
                        <div class="pv-logo-badge" style="background:${t.accent};color:${t.primary};">${initials}</div>
                        <div class="pv-logo-name" style="color:#fff;">${cfg.clientName || 'Your Brand'}</div>
                    </div>
                    <div class="pv-nav-pill" style="background:${t.secondary};">Tenant Portal</div>
                </div>
                <div class="pv-hero">
                    <span class="pv-hero-tag" style="background:${t.accent}22;color:${t.secondary};">Powered by Mwarokin Estates</span>
                    <div class="pv-hero-title">Find your next home with ${cfg.clientName || 'us'}</div>
                    <div class="pv-hero-sub">Verified listings · Secure payments · Real-time support</div>
                    <span class="pv-btn" style="background:${t.primary};">Browse listings</span>
                </div>
                <div class="pv-cards">
                    <div class="pv-card" style="border-color:${t.primary};"><div class="pvc-t">2-Bed Apartment</div><div class="pvc-s">${cfg.currency||'KES'} 45,000 / mo</div></div>
                    <div class="pv-card" style="border-color:${t.accent};"><div class="pvc-t">Studio Unit</div><div class="pvc-s">${cfg.currency||'KES'} 22,000 / mo</div></div>
                </div>
            </div>
        </div>`;
    }

    /* ---------- DOMAIN ---------- */
    renderDomain(){
        const cfg = this.cfg();
        return `
        <div class="grid2">
            <div class="card">
                <div class="card-title"><i class="fas fa-globe" style="color:var(--gold);"></i>Subdomain</div>
                <div class="card-sub">Free and instant — included with every plan.</div>
                <div class="f-group">
                    <label class="f-label">Choose your subdomain</label>
                    <div class="domain-preview">
                        <input type="text" id="subdomainInput" value="${cfg.subdomain}" placeholder="yourbrand" />
                        <span class="dp-suffix">.mwarokinestates.africa</span>
                    </div>
                    <div class="f-hint"><span class="pill pill-active"><i class="fas fa-check"></i> Active</span> &nbsp;Live at <span class="mono">${cfg.subdomain||'yourbrand'}.mwarokinestates.africa</span></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-link" style="color:var(--gold);"></i>Custom domain</div>
                <div class="card-sub">Point your own domain at your white-labeled portal.</div>
                <div class="f-group">
                    <label class="f-label">Custom domain</label>
                    <input type="text" id="customDomainInput" class="f-input mono" value="${cfg.customDomain}" placeholder="e.g. portal.zawadiproperties.co.ke" />
                </div>
                <div class="f-hint" style="margin-bottom:10px;">Add these DNS records with your domain registrar:</div>
                <div class="dns-row"><span>Type</span><span>CNAME</span></div>

                <div style="display:flex;align-items:center;gap:10px;margin-top:12px;">
                    <span class="pill ${cfg.domainVerified?'pill-active':'pill-verifying'}"><i class="fas ${cfg.domainVerified?'fa-shield-halved':'fa-clock'}"></i>${cfg.domainVerified?'SSL active & verified':'Awaiting DNS verification'}</span>
                    <button class="btn btn-ghost" id="verifyDomainBtn" style="padding:7px 14px;font-size:11.5px;">Check now</button>
                </div>
            </div>

    /* ---------- LISTINGS ---------- */
    renderListings(){
        const { listings, listingsLoading } = this.state;
        return `
        <div class="card">
            <div class="card-title"><i class="fas fa-building" style="color:var(--gold);"></i>Property listings</div>
            <div class="card-sub">Synced from your portfolio in real time.</div>
            ${listingsLoading ? `<div style="text-align:center;padding:36px 0;color:var(--gray-600);"><span class="loading-spin"></span> &nbsp;Loading listings…</div>` : `
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;">
                ${listings.map(l=>`
                    <div class="listing-card2">
                        <span class="pill ${l.status==='available'?'pill-available':'pill-pending'}" style="position:absolute;top:12px;right:12px;">${l.status==='available'?'Available':'Pending'}</span>
                        <div class="listing-id2">${l.id}</div>
                        <div class="listing-tenant2">Tenant: ${l.tenant_id}</div>
                        <div class="listing-price2">${this.cfg().currency||'KES'} ${l.price.toLocaleString()}</div>
                    </div>`).join('')}
            </div>`}
        </div>`;
    }

    /* ---------- LEASES ---------- */
    renderLeases(){
        const r = this.state.leaseResult;
        return `
        <div class="grid2">
            <div class="card">
                <div class="card-title"><i class="fas fa-file-signature" style="color:var(--gold);"></i>Lease draft</div>
                <div class="card-sub">Generate a lease instantly from a listing and applicant.</div>
                <form id="leaseForm">
                    <div class="f-group"><label class="f-label">Listing ID</label><input type="text" id="listingIdInput" class="f-input" placeholder="e.g. LST001" required /></div>
                    <div class="f-group"><label class="f-label">Applicant ID</label><input type="text" id="applicantIdInput" class="f-input" placeholder="e.g. APP-2201" required /></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="leaseSubmitBtn">
                        <i class="fas fa-file-signature"></i> Create lease draft
                    </button>
                </form>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-scroll" style="color:var(--gold);"></i>Draft result</div>
                ${r ? `
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <div class="f-hint" style="font-size:12.5px;"><b style="color:var(--navy);">Clauses:</b> ${r.clauses.join(', ')}</div>
                    <div class="f-hint" style="font-size:12.5px;"><b style="color:var(--navy);">Term:</b> ${r.schedule.start_date} → ${r.schedule.end_date}</div>
                    <div class="f-hint" style="font-size:12.5px;"><b style="color:var(--navy);">Monthly rent:</b> ${this.cfg().currency} ${r.schedule.rent.toLocaleString()}</div>
                    <div class="f-hint" style="font-size:12.5px;"><b style="color:var(--navy);">Flagged risks:</b> ${r.risks.join(', ')}</div>
                </div>` : `<div style="color:var(--gray-600);font-size:12.5px;padding:20px 0;text-align:center;">Submit the form to generate a lease draft.</div>`}
            </div>
        </div>`;
    }

    /* ---------- MATCHMAKING ---------- */
    renderMatchmaking(){
        const m = this.state.matchResult;
        const p = this.state.profileResult;
        return `
        <div class="grid2">
            <div class="card">
                <div class="card-title"><i class="fas fa-people-arrows" style="color:var(--gold);"></i>Find matches</div>
                <div class="card-sub">Match a buyer profile against your active listings.</div>
                <form id="matchForm">
                    <div class="f-group"><label class="f-label">Buyer profile ID</label><input type="text" id="profileIdInput" class="f-input" placeholder="e.g. BP001" required /></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="matchSubmitBtn"><i class="fas fa-magnifying-glass"></i> Find matches</button>
                </form>
                ${p ? `
                <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div class="f-hint">Budget: <b style="color:var(--navy);">${this.cfg().currency} ${p.preferences.min_price.toLocaleString()}–${p.preferences.max_price.toLocaleString()}</b></div>
                    <div class="f-hint">Location: <b style="color:var(--navy);">${p.preferences.location}</b></div>
                    <div class="f-hint">Type: <b style="color:var(--navy);">${p.preferences.property_type}</b></div>
                    <div class="f-hint">Bedrooms: <b style="color:var(--navy);">${p.preferences.bedrooms}</b></div>
                </div>` : ''}
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-star" style="color:var(--gold);"></i>Best-fit listings</div>
                ${m && m.length ? `<div style="display:flex;flex-direction:column;gap:9px;">
                    ${m.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--gray-100);border-radius:10px;">
                        <span style="font-size:12.5px;font-weight:700;color:var(--navy);">${x.listing_id}</span>
                        <span class="pill pill-available">${x.score}% match</span>
                    </div>`).join('')}
                </div>` : `<div style="color:var(--gray-600);font-size:12.5px;padding:20px 0;text-align:center;">Run a match to see recommended listings.</div>`}
            </div>
        </div>`;
    }

    /* ---------- API ---------- */
    renderApi(){
        const cfg = this.cfg();
        const masked = this.state.keyVisible ? cfg.apiKey : cfg.apiKey.slice(0,9) + '••••••••••••••••••';
        return `
        <div class="grid2">
            <div class="card">
                <div class="card-title"><i class="fas fa-key" style="color:var(--gold);"></i>API key</div>
                <div class="card-sub">Use this key to authenticate requests from your systems.</div>
                <div class="key-box">
                    <span class="kv">${masked}</span>
                    <button class="key-btn" id="toggleKeyBtn" title="Show/hide"><i class="fas fa-eye${this.state.keyVisible?'-slash':''}"></i></button>
                    <button class="key-btn" id="copyKeyBtn" title="Copy"><i class="fas fa-copy"></i></button>
                </div>
                <div style="display:flex;gap:10px;margin-top:14px;">
                    <button class="btn btn-ghost" id="regenKeyBtn"><i class="fas fa-rotate"></i> Regenerate key</button>
                </div>
                <div class="card-title" style="margin-top:22px;"><i class="fas fa-satellite-dish" style="color:var(--gold);"></i>Webhook URL</div>
                <div class="card-sub">We'll POST payment and listing events here.</div>
                <input type="text" id="webhookInput" class="f-input mono" value="${cfg.webhookUrl}" placeholder="https://yourapp.co.ke/webhooks/mwarokin" />
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-code" style="color:var(--gold);"></i>Example request</div>
                <div class="card-sub">Fetch your active listings from the API.</div>
                <div class="code-box">curl https://api.mwarokinestates.africa/v1/listings \\
  -H "Authorization: Bearer ${cfg.apiKey.slice(0,9)}••••••••"</div>
                <div class="card-title" style="margin-top:20px;"><i class="fas fa-bolt" style="color:var(--gold);"></i>Event types</div>
                <ul class="tier-list">
                    <li><i class="fas fa-check" style="color:var(--green);margin-top:2px;"></i>payment.completed</li>
                    <li><i class="fas fa-check" style="color:var(--green);margin-top:2px;"></i>lease.created</li>
                    <li><i class="fas fa-check" style="color:var(--green);margin-top:2px;"></i>listing.updated</li>
                    <li><i class="fas fa-check" style="color:var(--green);margin-top:2px;"></i>tenant.matched</li>
                </ul>
            </div>
        </div>`;
    }

    /* ---------- PLAN ---------- */
    renderPlan(){
        const cfg = this.cfg();
        const used = { listings:5, apiCalls:1240, storage:0.4 };
        const tier = PLAN_TIERS.find(t=>t.id===cfg.planId);
        return `
        <div class="card" style="margin-bottom:18px;">
            <div class="card-title"><i class="fas fa-chart-line" style="color:var(--gold);"></i>Current usage — ${tier.name} plan</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:8px;">
                <div>
                    <div class="f-hint">Listings used</div>
                    <div style="font-weight:700;color:var(--navy);font-size:13.5px;">${used.listings} / ${tier.listings}</div>
                    <div class="meter"><div class="meter-fill" style="width:${typeof tier.listings==='number'?Math.min(100,used.listings/tier.listings*100):20}%;"></div></div>
                </div>
                <div>
                    <div class="f-hint">API calls this month</div>
                    <div style="font-weight:700;color:var(--navy);font-size:13.5px;">${used.apiCalls.toLocaleString()} / ${tier.apiCalls}</div>
                    <div class="meter"><div class="meter-fill" style="width:35%;"></div></div>
                </div>
                <div>
                    <div class="f-hint">Storage used</div>
                    <div style="font-weight:700;color:var(--navy);font-size:13.5px;">${used.storage} GB / ${tier.storage}</div>
                    <div class="meter"><div class="meter-fill" style="width:15%;"></div></div>
                </div>
            </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;">
            ${PLAN_TIERS.map(t=>`
                <div class="tier-card ${t.id===cfg.planId?'current':''}">
                    ${t.id===cfg.planId?'<span class="tier-badge">Current plan</span>':''}
                    <div class="tier-name">${t.name}</div>
                    <div class="tier-price">${t.price}</div>
                    <ul class="tier-list">
                        ${t.features.map(f=>`<li><i class="fas fa-check" style="color:var(--gold-dim);margin-top:2px;"></i>${f}</li>`).join('')}
                    </ul>
                    ${t.id===cfg.planId ? `<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:16px;" disabled>Active plan</button>`
                        : `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:16px;" data-selectplan="${t.id}">Switch to ${t.name}</button>`}
                </div>`).join('')}
        </div>`;
    }

    /* ---------- LISTENERS ---------- */
    setupListeners(){
        document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', ()=> this.setState({ activeTab: el.getAttribute('data-tab') })));

        const refreshBtn = document.getElementById('refreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', () => { this.fetchListings(); showNotification('Data refreshed.', 'success'); });

        const publishBtn = document.getElementById('publishBtn');
        if (publishBtn) publishBtn.addEventListener('click', () => this.handlePublish());

        // Branding
        const clientNameInput = document.getElementById('clientNameInput');
        if (clientNameInput) clientNameInput.addEventListener('input', e => { this.state.cfg.clientName = e.target.value; this.refreshPreviewOnly(); });
        const localeSelect = document.getElementById('localeSelect');
        if (localeSelect) localeSelect.addEventListener('change', e => { this.state.cfg.locale = e.target.value; });
        const currencySelect = document.getElementById('currencySelect');
        if (currencySelect) currencySelect.addEventListener('change', e => { this.state.cfg.currency = e.target.value; this.refreshPreviewOnly(); });
        const fontSelect = document.getElementById('fontSelect');
        if (fontSelect) fontSelect.addEventListener('change', e => { this.state.cfg.fontPair = e.target.value; });

        ['primary','secondary','accent'].forEach(key=>{
            const input = document.getElementById(`${key}Color`);
            if (input) input.addEventListener('input', e => {
                this.state.cfg.theme[key] = e.target.value;
                const hex = document.getElementById(`${key}Hex`);
                if (hex) hex.textContent = e.target.value;
                this.refreshPreviewOnly();
            });
        });

        document.querySelectorAll('[data-preset]').forEach(el=>el.addEventListener('click', ()=>{
            const id = parseInt(el.getAttribute('data-preset'));
            const preset = THEME_PRESETS.find(p=>p.id===id);
            this.state.cfg.theme = { ...preset };
            this.render();
        }));

        // Domain
        const subdomainInput = document.getElementById('subdomainInput');
        if (subdomainInput) subdomainInput.addEventListener('input', e => { this.state.cfg.subdomain = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,''); });
        const customDomainInput = document.getElementById('customDomainInput');
        if (customDomainInput) customDomainInput.addEventListener('input', e => { this.state.cfg.customDomain = e.target.value; });
        const verifyDomainBtn = document.getElementById('verifyDomainBtn');
        if (verifyDomainBtn) verifyDomainBtn.addEventListener('click', () => {
            showNotification('Checking DNS records…', 'info');
            setTimeout(()=>{ this.state.cfg.domainVerified = true; saveConfig(this.state.cfg); this.render(); showNotification('Domain verified and SSL issued.', 'success'); }, 1600);
        });

        // Leases
        const leaseForm = document.getElementById('leaseForm');
        if (leaseForm) leaseForm.addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('leaseSubmitBtn');
            btn.disabled = true; btn.innerHTML = '<span class="loading-spin"></span> Creating…';
            try{ const r = await mockApiCall('/lease/draft'); this.setState({ leaseResult:r }); showNotification('Lease draft created.', 'success'); }
            catch(err){ showNotification('Failed to create lease draft.', 'error'); }
        });

        // Matchmaking
        const matchForm = document.getElementById('matchForm');
        if (matchForm) matchForm.addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('matchSubmitBtn');
            btn.disabled = true; btn.innerHTML = '<span class="loading-spin"></span> Searching…';
            try{
                const [m,p] = await Promise.all([mockApiCall('/matchmaking'), mockApiCall('/api/buyer-profile')]);
                this.setState({ matchResult:m, profileResult:p });
                showNotification(`${m.length} matches found.`, 'success');
            }catch(err){ showNotification('Matchmaking failed.', 'error'); }
        });

        // API
        const toggleKeyBtn = document.getElementById('toggleKeyBtn');
        if (toggleKeyBtn) toggleKeyBtn.addEventListener('click', () => this.setState({ keyVisible: !this.state.keyVisible }));
        const copyKeyBtn = document.getElementById('copyKeyBtn');
        if (copyKeyBtn) copyKeyBtn.addEventListener('click', () => {
            navigator.clipboard?.writeText(this.state.cfg.apiKey).catch(()=>{});
            showNotification('API key copied to clipboard.', 'success');
        });
        const regenKeyBtn = document.getElementById('regenKeyBtn');
        if (regenKeyBtn) regenKeyBtn.addEventListener('click', () => {
            this.state.cfg.apiKey = `mwk_live_${rid()}${rid()}`.toLowerCase();
            saveConfig(this.state.cfg);
            this.setState({ keyVisible:true });
            showNotification('New API key generated. Update your integrations.', 'success');
        });
        const webhookInput = document.getElementById('webhookInput');
        if (webhookInput) webhookInput.addEventListener('input', e => { this.state.cfg.webhookUrl = e.target.value; });

        // Plan
        document.querySelectorAll('[data-selectplan]').forEach(el=>el.addEventListener('click', ()=>{
            const id = el.getAttribute('data-selectplan');
            this.state.cfg.planId = id;
            saveConfig(this.state.cfg);
            this.render();
            showNotification(`Switched to the ${PLAN_TIERS.find(t=>t.id===id).name} plan.`, 'success');
        }));
    }

    refreshPreviewOnly(){
        const holder = document.querySelector('.preview-frame');
        if (holder && holder.parentElement) holder.parentElement.innerHTML = this.renderPreviewFrame();
    }

    async handlePublish(){
        this.setState({ saving:true });
        await new Promise(r=>setTimeout(r, 1100));
        saveConfig(this.state.cfg);
        this.setState({ saving:false });
        showNotification(`Your branding is now live at ${this.state.cfg.subdomain||'yourbrand'}.mwarokinestates.africa`, 'success', 'Published');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    window.studio = new WhiteLabelStudio();
    window.studio.init();
});
</script>
</body>
</html>
